<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaGary AI</title>

  <style>
    :root {
      --page: #f6f8fb;
      --panel: #ffffff;
      --panel-soft: #f1f5f9;
      --panel-hover: #eaf0f7;
      --sidebar: rgba(255, 255, 255, 0.82);
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-2: #7c3aed;
      --primary-hover: #1d4ed8;
      --assistant: #ffffff;
      --user: linear-gradient(135deg, #2563eb, #7c3aed);
      --shadow: rgba(15, 23, 42, 0.08);
      --shadow-strong: rgba(15, 23, 42, 0.16);
      --danger: #ef4444;
      --success: #10b981;
      --glass: rgba(255, 255, 255, 0.74);
    }

    body.dark {
      --page: #0b1020;
      --panel: #111827;
      --panel-soft: #172033;
      --panel-hover: #202b42;
      --sidebar: rgba(10, 15, 28, 0.88);
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #243047;
      --assistant: #141c2d;
      --shadow: rgba(0, 0, 0, 0.35);
      --shadow-strong: rgba(0, 0, 0, 0.55);
      --glass: rgba(17, 24, 39, 0.72);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.10), transparent 34%),
        radial-gradient(circle at top right, rgba(124, 58, 237, 0.10), transparent 32%),
        var(--page);
      color: var(--text);
      font-family: "Inter", "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    button,
    select,
    textarea,
    input {
      font-family: inherit;
    }

    .auth-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background:
        radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.18), transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(124, 58, 237, 0.18), transparent 30%),
        var(--page);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      width: 390px;
      background: var(--glass);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 28px 80px var(--shadow-strong);
    }

    .auth-logo {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      margin-bottom: 18px;
      box-shadow: 0 12px 34px rgba(37, 99, 235, 0.32);
    }

    .auth-card h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -0.8px;
    }

    .auth-card p {
      color: var(--muted);
      font-size: 14px;
      margin: 10px 0 24px;
      line-height: 1.6;
    }

    .auth-card input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 15px;
      font-size: 15px;
      background: var(--panel);
      color: var(--text);
      outline: none;
      box-shadow: 0 8px 24px var(--shadow);
    }

    .auth-card input:focus {
      border-color: rgba(37, 99, 235, 0.7);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .auth-card button {
      width: 100%;
      margin-top: 15px;
      border: none;
      border-radius: 16px;
      padding: 14px;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      font-size: 15px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 12px 32px rgba(37, 99, 235, 0.28);
      transition: 0.2s;
    }

    .auth-card button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 40px rgba(37, 99, 235, 0.36);
    }

    .auth-error {
      margin-top: 12px;
      color: var(--danger);
      font-size: 13px;
      min-height: 18px;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    .sidebar {
      width: 300px;
      background: var(--sidebar);
      backdrop-filter: blur(18px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      gap: 14px;
      transition: width 0.24s ease, padding 0.24s ease;
      position: relative;
      z-index: 20;
    }

    body.sidebar-collapsed .sidebar {
      width: 76px;
      padding: 18px 10px;
    }

    .brand {
      padding: 4px 6px 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 15px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.28);
    }

    .brand-text {
      min-width: 0;
      overflow: hidden;
      transition: opacity 0.16s ease;
    }

    body.sidebar-collapsed .brand-text,
    body.sidebar-collapsed .section-title,
    body.sidebar-collapsed .chat-name,
    body.sidebar-collapsed .sidebar-bottom,
    body.sidebar-collapsed .new-chat span {
      display: none;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.4px;
      white-space: nowrap;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
    }

    .sidebar-toggle {
      position: absolute;
      right: -15px;
      top: 26px;
      width: 30px;
      height: 30px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 22px var(--shadow);
      z-index: 40;
      transition: 0.2s;
    }

    .sidebar-toggle:hover {
      transform: scale(1.06);
    }

    .new-chat {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 16px;
      padding: 13px 14px;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 8px 22px var(--shadow);
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    body.sidebar-collapsed .new-chat {
      justify-content: center;
      padding: 13px 0;
    }

    .new-chat:hover {
      transform: translateY(-1px);
      background: var(--panel-hover);
    }

    .section-title {
      font-size: 12px;
      color: var(--muted);
      padding: 4px 8px;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }

    .chat-list::-webkit-scrollbar,
    .chat-area::-webkit-scrollbar {
      width: 8px;
    }

    .chat-list::-webkit-scrollbar-thumb,
    .chat-area::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 999px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 11px 10px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text);
      transition: 0.18s;
    }

    body.sidebar-collapsed .chat-item {
      justify-content: center;
      padding: 12px 0;
    }

    .chat-icon {
      width: 26px;
      height: 26px;
      border-radius: 9px;
      background: var(--panel-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .chat-item:hover,
    .chat-item.active {
      background: var(--panel-soft);
    }

    .chat-item.active .chat-icon {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
    }

    .chat-name {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .delete-btn {
      display: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 17px;
      cursor: pointer;
    }

    .chat-item:hover .delete-btn {
      display: block;
    }

    body.sidebar-collapsed .delete-btn {
      display: none !important;
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .small-action {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      transition: 0.2s;
    }

    .small-action:hover {
      background: var(--panel-soft);
      transform: translateY(-1px);
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: transparent;
    }

    .topbar {
      height: 72px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .title-area {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .current-title {
      font-size: 17px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 440px;
    }

    .current-model {
      font-size: 12px;
      color: var(--muted);
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .model-wrap {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      box-shadow: 0 8px 24px var(--shadow);
      min-width: 330px;
    }

    .model-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
      flex-shrink: 0;
    }

    .model-label {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .model-select {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      outline: none;
      font-size: 13px;
      font-weight: 700;
      min-width: 0;
      cursor: pointer;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 13px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: 0.2s;
      box-shadow: 0 8px 24px var(--shadow);
    }

    .btn:hover {
      background: var(--panel-soft);
      transform: translateY(-1px);
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 140px;
    }

    .welcome {
      max-width: 900px;
      margin: 0 auto;
      padding: 90px 24px 24px;
      text-align: center;
    }

    .hero-badge {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px var(--shadow);
    }

    .hero-badge span {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
    }

    .welcome h1 {
      font-size: 52px;
      line-height: 1.05;
      margin: 0;
      letter-spacing: -1.8px;
      background: linear-gradient(135deg, var(--text), #2563eb 58%, #7c3aed);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
  }

    .welcome p {
      margin: 16px auto 0;
      color: var(--muted);
      font-size: 16px;
      max-width: 580px;
      line-height: 1.7;
    }

    .prompt-grid {
      margin-top: 38px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .prompt-card {
      border: 1px solid var(--border);
      background: var(--glass);
      backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 18px;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 12px 34px var(--shadow);
      transition: 0.22s;
      position: relative;
      overflow: hidden;
    }

    .prompt-card::after {
      content: "";
      position: absolute;
      inset: auto -30px -40px auto;
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, rgba(37,99,235,0.13), transparent 60%);
    }

    .prompt-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 46px var(--shadow-strong);
      border-color: rgba(37, 99, 235, 0.28);
    }

    .prompt-card strong {
      display: block;
      font-size: 15px;
      margin-bottom: 7px;
    }

    .prompt-card span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .messages {
      max-width: 940px;
      margin: 0 auto;
      padding: 34px 24px;
    }

    .msg {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      animation: fadeUp 0.22s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      flex-shrink: 0;
      margin-top: 2px;
      box-shadow: 0 10px 26px rgba(37, 99, 235, 0.22);
    }

    .msg.user .avatar {
      display: none;
    }

    .bubble-wrap {
      max-width: 78%;
      display: flex;
      flex-direction: column;
      gap: 7px;
      position: relative;
    }

    .bubble {
      padding: 16px 18px;
      border-radius: 22px;
      line-height: 1.78;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 10px 28px var(--shadow);
      position: relative;
    }

    .msg.assistant .bubble {
      background: var(--assistant);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 8px;
      padding-right: 50px;
    }

    .msg.user .bubble {
      background: var(--user);
      color: white;
      border-bottom-right-radius: 8px;
      box-shadow: 0 14px 34px rgba(37, 99, 235, 0.22);
    }

    .copy-floating {
      position: absolute;
      right: 10px;
      top: 10px;
      width: 30px;
      height: 30px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      border-radius: 10px;
      cursor: pointer;
      opacity: 0.72;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .copy-floating:hover {
      opacity: 1;
      color: var(--text);
      transform: scale(1.05);
      background: var(--panel-soft);
    }

    .msg-actions {
      display: flex;
      gap: 8px;
      padding-left: 4px;
    }

    .mini-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      padding: 4px 7px;
      border-radius: 8px;
    }

    .mini-btn:hover {
      background: var(--panel-soft);
      color: var(--text);
    }

    pre {
      background: rgba(15, 23, 42, 0.08);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 12px;
      overflow-x: auto;
      white-space: pre;
    }

    body.dark pre {
      background: rgba(0,0,0,0.25);
    }

    code {
      font-family: Consolas, Monaco, monospace;
      font-size: 14px;
    }

    .composer-wrap {
      position: fixed;
      left: 300px;
      right: 0;
      bottom: 0;
      padding: 22px 30px 26px;
      background: linear-gradient(to top, var(--page) 78%, transparent);
      transition: left 0.24s ease;
      z-index: 15;
    }

    body.sidebar-collapsed .composer-wrap {
      left: 76px;
    }

    .composer {
      max-width: 940px;
      margin: 0 auto;
      background: var(--glass);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 14px 14px 10px 18px;
      box-shadow: 0 20px 56px var(--shadow-strong);
    }

    .composer-inner {
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.6;
      min-height: 36px;
      max-height: 190px;
      padding: 5px 0;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .send-btn {
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white;
      font-size: 21px;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
      box-shadow: 0 12px 32px rgba(37, 99, 235, 0.28);
    }

    .send-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 16px 40px rgba(37, 99, 235, 0.36);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .composer-foot {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
      align-items: center;
    }

    .token-select {
      border: none;
      background: transparent;
      color: var(--muted);
      outline: none;
      font-size: 12px;
      cursor: pointer;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      height: 20px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: var(--muted);
      border-radius: 50%;
      animation: pulse 1.3s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes pulse {
      0%, 80%, 100% {
        opacity: 0.35;
        transform: translateY(0);
      }
      40% {
        opacity: 1;
        transform: translateY(-5px);
      }
    }

    @media (max-width: 900px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
      }

      body.mobile-sidebar-open .sidebar {
        transform: translateX(0);
      }

      body.sidebar-collapsed .sidebar {
        width: 300px;
      }

      .composer-wrap,
      body.sidebar-collapsed .composer-wrap {
        left: 0;
      }

      .topbar {
        padding: 0 16px;
      }

      .model-wrap {
        min-width: 190px;
        width: 190px;
      }

      .model-label {
        display: none;
      }

      .prompt-grid {
        grid-template-columns: 1fr;
      }

      .bubble-wrap {
        max-width: 88%;
      }

      .welcome h1 {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>
  <div class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="auth-logo">M</div>
      <h1>MaGary AI</h1>
      <p id="authTip">正在检查访问权限...</p>
      <input id="passwordInput" type="password" placeholder="请输入访问密码" />
      <button onclick="login()">进入 MaGary AI</button>
      <div class="auth-error" id="authError"></div>
    </div>
  </div>

  <div class="app">
    <aside class="sidebar">
      <button class="sidebar-toggle" onclick="toggleSidebar()" title="展开 / 收起">☰</button>

      <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-text">
          <div class="brand-title">MaGary AI</div>
          <div class="brand-subtitle">Private AI Workspace</div>
        </div>
      </div>

      <button class="new-chat" onclick="newChat()">
        <strong>＋</strong>
        <span>新建聊天</span>
      </button>

      <div class="section-title">会话</div>
      <div class="chat-list" id="chatList"></div>

      <div class="sidebar-bottom">
        <button class="small-action" onclick="copyCurrentChat()">复制当前会话</button>
        <button class="small-action" onclick="clearCurrentChat()">清空当前会话</button>
        <button class="small-action" onclick="logout()">退出访问</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-area">
          <div class="current-title" id="currentTitle">新聊天</div>
          <div class="current-model" id="currentModelText">准备就绪</div>
        </div>

        <div class="top-controls">
          <div class="model-wrap">
            <span class="model-dot"></span>
            <span class="model-label">Model</span>
            <select id="modelSelect" class="model-select"></select>
          </div>
          <button class="btn" onclick="toggleTheme()">主题</button>
        </div>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <div class="hero-badge"><span></span> Online · OpenRouter Powered</div>
          <h1>MaGary AI</h1>
          <p>你的私人 AI 工作台。选择模型，输入问题，然后让机器替人类分担一点点脑力劳动。</p>

          <div class="prompt-grid">
            <div class="prompt-card" onclick="usePrompt('请简单介绍一下你自己')">
              <strong>快速开始</strong>
              <span>让当前模型介绍自己</span>
            </div>

            <div class="prompt-card" onclick="usePrompt('请解释一下 FastAPI、前端页面、OpenRouter 三者之间的关系')">
              <strong>项目逻辑</strong>
              <span>理解本地 / 云端 API 项目结构</span>
            </div>

            <div class="prompt-card" onclick="usePrompt('请帮我优化这个 AI Chat 项目的代码结构')">
              <strong>代码优化</strong>
              <span>改进项目文件组织和功能</span>
            </div>

            <div class="prompt-card" onclick="usePrompt('请用简单例子讲解前端 fetch 如何调用后端接口')">
              <strong>接口调用</strong>
              <span>学习前后端通信逻辑</span>
            </div>
          </div>
        </div>

        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-wrap">
        <div class="composer">
          <div class="composer-inner">
            <textarea id="input" rows="1" placeholder="给 MaGary AI 发送消息"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
          </div>

          <div class="composer-foot">
            <span>Enter 发送，Shift + Enter 换行</span>
            <select id="maxTokens" class="token-select">
              <option value="512">512 tokens</option>
              <option value="1024" selected>1024 tokens</option>
              <option value="2048">2048 tokens</option>
            </select>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "magary_ai_chat_sessions";
    const THEME_KEY = "magary_ai_theme";
    const MODEL_KEY = "magary_ai_selected_model";
    const PASSWORD_KEY = "magary_ai_access_password";
    const SIDEBAR_KEY = "magary_ai_sidebar_collapsed";

    const authScreen = document.getElementById("authScreen");
    const authTip = document.getElementById("authTip");
    const passwordInput = document.getElementById("passwordInput");
    const authError = document.getElementById("authError");

    const chatListEl = document.getElementById("chatList");
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const chatArea = document.getElementById("chatArea");
    const welcome = document.getElementById("welcome");
    const currentTitle = document.getElementById("currentTitle");
    const currentModelText = document.getElementById("currentModelText");
    const modelSelect = document.getElementById("modelSelect");
    const maxTokens = document.getElementById("maxTokens");

    let sessions = [];
    let currentId = null;
    let passwordRequired = true;

    const fallbackModels = [
      { id: "openrouter/free", name: "OpenRouter Free" },
      { id: "deepseek/deepseek-v4-flash:free", name: "DeepSeek V4 Flash Free" },
      { id: "openrouter/owl-alpha", name: "Owl Alpha Free" },
      { id: "poolside/laguna-xs.2:free", name: "Poolside Laguna XS.2 Free" },
      { id: "poolside/laguna-m.1:free", name: "Poolside Laguna M.1 Free" },
      { id: "qwen/qwen3.7-max", name: "Qwen3.7 Max" },
      { id: "google/gemini-3.5-flash", name: "Gemini 3.5 Flash" },
      { id: "openai/gpt-chat-latest", name: "GPT Chat Latest" },
      { id: "x-ai/grok-4.3", name: "Grok 4.3" }
    ];

    function getPassword() {
      return sessionStorage.getItem(PASSWORD_KEY) || "";
    }

    function setPassword(pwd) {
      sessionStorage.setItem(PASSWORD_KEY, pwd);
    }

    function clearPassword() {
      sessionStorage.removeItem(PASSWORD_KEY);
    }

    async function initAuth() {
      authScreen.style.display = "flex";
      authTip.textContent = "正在检查访问权限...";
      passwordInput.style.display = "none";

      try {
        const res = await fetch("/auth/status");
        const data = await res.json();

        passwordRequired = !!data.password_required;

        if (!passwordRequired) {
          authScreen.style.display = "none";
          return;
        }

        const savedPassword = getPassword();

        if (savedPassword) {
          const ok = await verifyPassword(savedPassword, false);
          if (ok) {
            authScreen.style.display = "none";
            return;
          }
          clearPassword();
        }

        showLoginBox();

      } catch (err) {
        authTip.textContent = "权限检查失败，请刷新页面";
        authError.textContent = err.message;
      }
    }

    function showLoginBox() {
      authTip.textContent = "请输入访问密码";
      passwordInput.style.display = "block";
      passwordInput.value = "";
      authError.textContent = "";
      setTimeout(() => passwordInput.focus(), 100);
    }

    async function verifyPassword(pwd, showError = true) {
      try {
        const res = await fetch("/auth", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ password: pwd })
        });

        if (res.ok) {
          return true;
        }

        if (showError) {
          authError.textContent = "密码错误";
        }

        return false;
      } catch (err) {
        if (showError) {
          authError.textContent = "验证失败：" + err.message;
        }
        return false;
      }
    }

    async function login() {
      const pwd = passwordInput.value.trim();

      if (!pwd) {
        authError.textContent = "请输入密码";
        return;
      }

      const ok = await verifyPassword(pwd, true);

      if (ok) {
        setPassword(pwd);
        authScreen.style.display = "none";
        inputEl.focus();
      }
    }

    function logout() {
      clearPassword();
      showLoginBox();
      authScreen.style.display = "flex";
    }

    passwordInput.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        login();
      }
    });

    function uid() {
      return "chat_" + Date.now() + "_" + Math.random().toString(16).slice(2);
    }

    function loadTheme() {
      if (localStorage.getItem(THEME_KEY) === "dark") {
        document.body.classList.add("dark");
      }
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
      localStorage.setItem(
        THEME_KEY,
        document.body.classList.contains("dark") ? "dark" : "light"
      );
    }

    function loadSidebarState() {
      if (localStorage.getItem(SIDEBAR_KEY) === "true") {
        document.body.classList.add("sidebar-collapsed");
      }
    }

    function toggleSidebar() {
      document.body.classList.toggle("sidebar-collapsed");
      localStorage.setItem(
        SIDEBAR_KEY,
        document.body.classList.contains("sidebar-collapsed") ? "true" : "false"
      );
    }

    function loadSessions() {
      try {
        sessions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        sessions = [];
      }

      if (!sessions.length) {
        sessions.push({
          id: uid(),
          title: "新聊天",
          messages: []
        });
      }

      currentId = sessions[0].id;
      saveSessions();
      renderAll();
    }

    function saveSessions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
    }

    function getCurrentSession() {
      return sessions.find(s => s.id === currentId);
    }

    function renderChatList() {
      chatListEl.innerHTML = "";

      sessions.forEach(session => {
        const item = document.createElement("div");
        item.className = "chat-item" + (session.id === currentId ? " active" : "");

        const icon = document.createElement("div");
        icon.className = "chat-icon";
        icon.textContent = "✦";

        const name = document.createElement("div");
        name.className = "chat-name";
        name.textContent = session.title || "新聊天";

        const del = document.createElement("button");
        del.className = "delete-btn";
        del.textContent = "×";
        del.onclick = e => {
          e.stopPropagation();
          deleteSession(session.id);
        };

        item.onclick = () => {
          currentId = session.id;
          renderAll();
        };

        item.appendChild(icon);
        item.appendChild(name);
        item.appendChild(del);
        chatListEl.appendChild(item);
      });
    }

    function renderMessages() {
      const session = getCurrentSession();

      messagesEl.innerHTML = "";
      currentTitle.textContent = session.title || "新聊天";

      if (!session.messages.length) {
        welcome.style.display = "block";
        return;
      }

      welcome.style.display = "none";

      session.messages.forEach(msg => {
        addMessageToDOM(msg.content, msg.role, false);
      });

      scrollBottom();
    }

    function renderAll() {
      renderChatList();
      renderMessages();
    }

    function newChat() {
      sessions.unshift({
        id: uid(),
        title: "新聊天",
        messages: []
      });

      currentId = sessions[0].id;
      saveSessions();
      renderAll();
      inputEl.focus();
    }

    function deleteSession(id) {
      sessions = sessions.filter(s => s.id !== id);

      if (!sessions.length) {
        sessions.push({
          id: uid(),
          title: "新聊天",
          messages: []
        });
      }

      if (currentId === id) {
        currentId = sessions[0].id;
      }

      saveSessions();
      renderAll();
    }

    function clearCurrentChat() {
      const session = getCurrentSession();
      session.messages = [];
      session.title = "新聊天";
      saveSessions();
      renderAll();
    }

    function setTitleFromMessage(text) {
      const session = getCurrentSession();

      if (session.title === "新聊天") {
        session.title = text.slice(0, 20) + (text.length > 20 ? "..." : "");
      }
    }

    function scrollBottom() {
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function simpleMarkdown(text) {
      let html = escapeHtml(text);
      html = html.replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      html = html.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\n/g, "<br>");
      return html;
    }

    function addMessageToDOM(content, role, save = true) {
      welcome.style.display = "none";

      const msg = document.createElement("div");
      msg.className = "msg " + role;

      if (role === "assistant") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "AI";
        msg.appendChild(avatar);
      }

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = simpleMarkdown(content);

      if (role === "assistant") {
        const copyFloating = document.createElement("button");
        copyFloating.className = "copy-floating";
        copyFloating.textContent = "⧉";
        copyFloating.title = "复制回答";
        copyFloating.onclick = async () => {
          await navigator.clipboard.writeText(content);
          copyFloating.textContent = "✓";
          setTimeout(() => copyFloating.textContent = "⧉", 900);
        };
        bubble.appendChild(copyFloating);
      }

      wrap.appendChild(bubble);
      msg.appendChild(wrap);
      messagesEl.appendChild(msg);
      scrollBottom();

      if (save) {
        const session = getCurrentSession();
        session.messages.push({ role, content });
        saveSessions();
        renderChatList();
      }

      return bubble;
    }

    function addTypingBubble() {
      welcome.style.display = "none";

      const msg = document.createElement("div");
      msg.className = "msg assistant";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "AI";

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

      wrap.appendChild(bubble);
      msg.appendChild(avatar);
      msg.appendChild(wrap);
      messagesEl.appendChild(msg);
      scrollBottom();

      return bubble;
    }

    async function loadModels() {
      try {
        const res = await fetch("/models");
        const data = await res.json();
        renderModels(data.models || fallbackModels);
      } catch {
        renderModels(fallbackModels);
      }
    }

    function renderModels(models) {
      modelSelect.innerHTML = "";

      models.forEach(model => {
        const option = document.createElement("option");
        option.value = model.id;
        option.textContent = model.name;
        modelSelect.appendChild(option);
      });

      const saved = localStorage.getItem(MODEL_KEY);
      if (saved) {
        modelSelect.value = saved;
      }

      updateModelText();
    }

    function updateModelText() {
      const selected = modelSelect.options[modelSelect.selectedIndex];
      currentModelText.textContent = selected ? selected.textContent : "未选择模型";
    }

    modelSelect.addEventListener("change", () => {
      localStorage.setItem(MODEL_KEY, modelSelect.value);
      updateModelText();
    });

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      const session = getCurrentSession();

      setTitleFromMessage(text);
      addMessageToDOM(text, "user");

      inputEl.value = "";
      autoResize();
      sendBtn.disabled = true;

      const typingBubble = addTypingBubble();

      const history = session.messages
        .filter(m => m.role === "user" || m.role === "assistant")
        .slice(-10);

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text,
            model: modelSelect.value || "openrouter/free",
            history: history,
            max_tokens: Number(maxTokens.value || 1024),
            password: getPassword()
          })
        });

        const data = await response.json();

        if (response.status === 401) {
          clearPassword();
          showLoginBox();
          authScreen.style.display = "flex";
          typingBubble.textContent = "访问密码错误，请重新登录";
          return;
        }

        if (data.reply) {
          typingBubble.innerHTML = simpleMarkdown(data.reply);

          const copyFloating = document.createElement("button");
          copyFloating.className = "copy-floating";
          copyFloating.textContent = "⧉";
          copyFloating.title = "复制回答";
          copyFloating.onclick = async () => {
            await navigator.clipboard.writeText(data.reply);
            copyFloating.textContent = "✓";
            setTimeout(() => copyFloating.textContent = "⧉", 900);
          };
          typingBubble.appendChild(copyFloating);

          session.messages.push({
            role: "assistant",
            content: data.reply
          });

          saveSessions();
          renderAll();
        } else {
          typingBubble.textContent = "请求失败：" + (data.error || JSON.stringify(data));
        }
      } catch (err) {
        typingBubble.textContent = "请求失败：" + err.message;
      }

      sendBtn.disabled = false;
      inputEl.focus();
      scrollBottom();
    }

    async function copyCurrentChat() {
      const session = getCurrentSession();

      if (!session.messages.length) return;

      const text = session.messages
        .map(m => `${m.role === "user" ? "用户" : "AI"}：${m.content}`)
        .join("\n\n");

      await navigator.clipboard.writeText(text);
      alert("当前会话已复制");
    }

    function usePrompt(text) {
      inputEl.value = text;
      autoResize();
      inputEl.focus();
    }

    function autoResize() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 190) + "px";
    }

    inputEl.addEventListener("input", autoResize);

    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    loadTheme();
    loadSidebarState();
    loadSessions();
    loadModels();
    initAuth();
    autoResize();
  </script>
</body>
</html>
