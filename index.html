<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuangHui AI Chat</title>

  <style>
    :root {
      --page: #f8fafc;
      --panel: #ffffff;
      --panel-2: #f1f5f9;
      --sidebar: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --assistant: #f1f5f9;
      --user: #2563eb;
      --shadow: rgba(15, 23, 42, 0.08);
      --danger: #ef4444;
    }

    body.dark {
      --page: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --sidebar: #020617;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #263244;
      --assistant: #1f2937;
      --user: #2563eb;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--page);
      color: var(--text);
      font-family: "Inter", "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    .sidebar {
      width: 290px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      gap: 14px;
    }

    .brand {
      padding: 6px 8px 8px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .new-chat {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 12px var(--shadow);
      transition: 0.2s;
    }

    .new-chat:hover {
      transform: translateY(-1px);
      background: var(--panel-2);
    }

    .section-title {
      font-size: 12px;
      color: var(--muted);
      padding: 4px 8px;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 11px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text);
      transition: 0.18s;
    }

    .chat-item:hover,
    .chat-item.active {
      background: var(--panel-2);
    }

    .chat-name {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .delete-btn {
      display: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 17px;
      cursor: pointer;
    }

    .chat-item:hover .delete-btn {
      display: block;
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .small-action {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }

    .small-action:hover {
      background: var(--panel-2);
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--page);
    }

    .topbar {
      height: 66px;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      flex-shrink: 0;
    }

    body.dark .topbar {
      background: rgba(17,24,39,0.72);
    }

    .title-area {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .current-title {
      font-size: 16px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 420px;
    }

    .current-model {
      font-size: 12px;
      color: var(--muted);
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .model-select {
      width: 270px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 12px;
      outline: none;
      font-size: 13px;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 12px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }

    .btn:hover {
      background: var(--panel-2);
      transform: translateY(-1px);
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 130px;
    }

    .welcome {
      max-width: 860px;
      margin: 0 auto;
      padding: 86px 24px 24px;
      text-align: center;
    }

    .welcome h1 {
      font-size: 42px;
      line-height: 1.15;
      margin: 0;
      letter-spacing: -0.6px;
    }

    .welcome p {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .prompt-grid {
      margin-top: 34px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .prompt-card {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 18px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 8px 24px var(--shadow);
      transition: 0.2s;
    }

    .prompt-card:hover {
      transform: translateY(-3px);
      background: var(--panel-2);
    }

    .prompt-card strong {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .prompt-card span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .messages {
      max-width: 920px;
      margin: 0 auto;
      padding: 30px 24px;
    }

    .msg {
      display: flex;
      gap: 12px;
      margin-bottom: 26px;
    }

    .msg.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: #10b981;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .msg.user .avatar {
      display: none;
    }

    .bubble-wrap {
      max-width: 78%;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .bubble {
      padding: 15px 17px;
      border-radius: 20px;
      line-height: 1.75;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 4px 14px var(--shadow);
    }

    .msg.assistant .bubble {
      background: var(--assistant);
      color: var(--text);
      border-bottom-left-radius: 7px;
    }

    .msg.user .bubble {
      background: var(--user);
      color: white;
      border-bottom-right-radius: 7px;
    }

    .msg-actions {
      display: flex;
      gap: 8px;
      padding-left: 4px;
    }

    .mini-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      padding: 4px 7px;
      border-radius: 8px;
    }

    .mini-btn:hover {
      background: var(--panel-2);
      color: var(--text);
    }

    pre {
      background: rgba(15, 23, 42, 0.08);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 12px;
      overflow-x: auto;
      white-space: pre;
    }

    body.dark pre {
      background: rgba(0,0,0,0.25);
    }

    code {
      font-family: Consolas, Monaco, monospace;
      font-size: 14px;
    }

    .composer-wrap {
      position: fixed;
      left: 290px;
      right: 0;
      bottom: 0;
      padding: 22px 28px 26px;
      background: linear-gradient(to top, var(--page) 78%, transparent);
    }

    .composer {
      max-width: 920px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 14px 14px 10px 18px;
      box-shadow: 0 16px 42px var(--shadow);
    }

    .composer-inner {
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.6;
      min-height: 34px;
      max-height: 180px;
      padding: 4px 0;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: var(--primary-hover);
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .composer-foot {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
    }

    .token-select {
      border: none;
      background: transparent;
      color: var(--muted);
      outline: none;
      font-size: 12px;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      height: 20px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: var(--muted);
      border-radius: 50%;
      animation: pulse 1.3s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes pulse {
      0%, 80%, 100% {
        opacity: 0.35;
        transform: translateY(0);
      }
      40% {
        opacity: 1;
        transform: translateY(-5px);
      }
    }

    @media (max-width: 900px) {
      .sidebar {
        display: none;
      }

      .composer-wrap {
        left: 0;
      }

      .topbar {
        padding: 0 16px;
      }

      .model-select {
        width: 180px;
      }

      .prompt-grid {
        grid-template-columns: 1fr;
      }

      .bubble-wrap {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title">GuangHui AI Chat</div>
        <div class="brand-subtitle">Local Interface</div>
      </div>

      <button class="new-chat" onclick="newChat()">＋ 新建聊天</button>

      <div class="section-title">会话</div>
      <div class="chat-list" id="chatList"></div>

      <div class="sidebar-bottom">
        <button class="small-action" onclick="copyCurrentChat()">复制当前会话</button>
        <button class="small-action" onclick="clearCurrentChat()">清空当前会话</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-area">
          <div class="current-title" id="currentTitle">新聊天</div>
          <div class="current-model" id="currentModelText">准备就绪</div>
        </div>

        <div class="top-controls">
          <select id="modelSelect" class="model-select"></select>
          <button class="btn" onclick="toggleTheme()">主题</button>
        </div>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <h1>GuangHui AI Chat</h1>
          <p>选择模型，开始对话。</p>

          <div class="prompt-grid">
            <div class="prompt-card" onclick="usePrompt('请简单介绍一下你自己')">
              <strong>快速开始</strong>
              <span>让当前模型介绍自己</span>
            </div>

            <div class="prompt-card" onclick="usePrompt('请解释一下 FastAPI、前端页面、OpenRouter 三者之间的关系')">
              <strong>项目逻辑</strong>
              <span>理解本地 API 项目结构</span>
            </div>

            <div class="prompt-card" onclick="usePrompt('请帮我优化这个本地 AI Chat 项目的代码结构')">
              <strong>代码优化</strong>
              <span>改进项目文件组织</span>
            </div>

            <div class="prompt-card" onclick="usePrompt('请用简单例子讲解前端 fetch 如何调用后端接口')">
              <strong>接口调用</strong>
              <span>学习前后端通信</span>
            </div>
          </div>
        </div>

        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-wrap">
        <div class="composer">
          <div class="composer-inner">
            <textarea id="input" rows="1" placeholder="输入消息"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
          </div>

          <div class="composer-foot">
            <span>Enter 发送，Shift + Enter 换行</span>
            <select id="maxTokens" class="token-select">
              <option value="512">512 tokens</option>
              <option value="1024" selected>1024 tokens</option>
              <option value="2048">2048 tokens</option>
            </select>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "guanghui_ai_chat_sessions_v3";
    const THEME_KEY = "guanghui_ai_theme_v3";
    const MODEL_KEY = "guanghui_ai_selected_model_v3";

    const chatListEl = document.getElementById("chatList");
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const chatArea = document.getElementById("chatArea");
    const welcome = document.getElementById("welcome");
    const currentTitle = document.getElementById("currentTitle");
    const currentModelText = document.getElementById("currentModelText");
    const modelSelect = document.getElementById("modelSelect");
    const maxTokens = document.getElementById("maxTokens");

    let sessions = [];
    let currentId = null;

    const fallbackModels = [
      { id: "deepseek/deepseek-v4-flash:free", name: "DeepSeek V4 Flash Free" },
      { id: "openrouter/free", name: "OpenRouter Free" },
      { id: "openrouter/owl-alpha", name: "Owl Alpha Free" },
      { id: "poolside/laguna-xs.2:free", name: "Poolside Laguna XS.2 Free" },
      { id: "poolside/laguna-m.1:free", name: "Poolside Laguna M.1 Free" },
      { id: "qwen/qwen3.7-max", name: "Qwen3.7 Max" },
      { id: "google/gemini-3.5-flash", name: "Gemini 3.5 Flash" },
      { id: "openai/gpt-chat-latest", name: "GPT Chat Latest" },
      { id: "x-ai/grok-4.3", name: "Grok 4.3" }
    ];

    function uid() {
      return "chat_" + Date.now() + "_" + Math.random().toString(16).slice(2);
    }

    function loadTheme() {
      if (localStorage.getItem(THEME_KEY) === "dark") {
        document.body.classList.add("dark");
      }
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
      localStorage.setItem(
        THEME_KEY,
        document.body.classList.contains("dark") ? "dark" : "light"
      );
    }

    function loadSessions() {
      try {
        sessions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        sessions = [];
      }

      if (!sessions.length) {
        sessions.push({
          id: uid(),
          title: "新聊天",
          messages: []
        });
      }

      currentId = sessions[0].id;
      saveSessions();
      renderAll();
    }

    function saveSessions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
    }

    function getCurrentSession() {
      return sessions.find(s => s.id === currentId);
    }

    function renderChatList() {
      chatListEl.innerHTML = "";

      sessions.forEach(session => {
        const item = document.createElement("div");
        item.className = "chat-item" + (session.id === currentId ? " active" : "");

        const name = document.createElement("div");
        name.className = "chat-name";
        name.textContent = session.title || "新聊天";

        const del = document.createElement("button");
        del.className = "delete-btn";
        del.textContent = "×";
        del.onclick = e => {
          e.stopPropagation();
          deleteSession(session.id);
        };

        item.onclick = () => {
          currentId = session.id;
          renderAll();
        };

        item.appendChild(name);
        item.appendChild(del);
        chatListEl.appendChild(item);
      });
    }

    function renderMessages() {
      const session = getCurrentSession();

      messagesEl.innerHTML = "";
      currentTitle.textContent = session.title || "新聊天";

      if (!session.messages.length) {
        welcome.style.display = "block";
        return;
      }

      welcome.style.display = "none";

      session.messages.forEach(msg => {
        addMessageToDOM(msg.content, msg.role, false);
      });

      scrollBottom();
    }

    function renderAll() {
      renderChatList();
      renderMessages();
    }

    function newChat() {
      sessions.unshift({
        id: uid(),
        title: "新聊天",
        messages: []
      });

      currentId = sessions[0].id;
      saveSessions();
      renderAll();
      inputEl.focus();
    }

    function deleteSession(id) {
      sessions = sessions.filter(s => s.id !== id);

      if (!sessions.length) {
        sessions.push({
          id: uid(),
          title: "新聊天",
          messages: []
        });
      }

      if (currentId === id) {
        currentId = sessions[0].id;
      }

      saveSessions();
      renderAll();
    }

    function clearCurrentChat() {
      const session = getCurrentSession();
      session.messages = [];
      session.title = "新聊天";
      saveSessions();
      renderAll();
    }

    function setTitleFromMessage(text) {
      const session = getCurrentSession();

      if (session.title === "新聊天") {
        session.title = text.slice(0, 20) + (text.length > 20 ? "..." : "");
      }
    }

    function scrollBottom() {
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function simpleMarkdown(text) {
      let html = escapeHtml(text);
      html = html.replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      html = html.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\n/g, "<br>");
      return html;
    }

    function addMessageToDOM(content, role, save = true) {
      welcome.style.display = "none";

      const msg = document.createElement("div");
      msg.className = "msg " + role;

      if (role === "assistant") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "AI";
        msg.appendChild(avatar);
      }

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = simpleMarkdown(content);

      wrap.appendChild(bubble);

      if (role === "assistant") {
        const actions = document.createElement("div");
        actions.className = "msg-actions";

        const copyBtn = document.createElement("button");
        copyBtn.className = "mini-btn";
        copyBtn.textContent = "复制回答";
        copyBtn.onclick = async () => {
          await navigator.clipboard.writeText(content);
          copyBtn.textContent = "已复制";
          setTimeout(() => copyBtn.textContent = "复制回答", 1000);
        };

        actions.appendChild(copyBtn);
        wrap.appendChild(actions);
      }

      msg.appendChild(wrap);
      messagesEl.appendChild(msg);
      scrollBottom();

      if (save) {
        const session = getCurrentSession();
        session.messages.push({ role, content });
        saveSessions();
        renderChatList();
      }

      return bubble;
    }

    function addTypingBubble() {
      welcome.style.display = "none";

      const msg = document.createElement("div");
      msg.className = "msg assistant";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "AI";

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

      wrap.appendChild(bubble);
      msg.appendChild(avatar);
      msg.appendChild(wrap);
      messagesEl.appendChild(msg);
      scrollBottom();

      return bubble;
    }

    async function loadModels() {
      try {
        const res = await fetch("/models");
        const data = await res.json();
        renderModels(data.models || fallbackModels);
      } catch {
        renderModels(fallbackModels);
      }
    }

    function renderModels(models) {
      modelSelect.innerHTML = "";

      models.forEach(model => {
        const option = document.createElement("option");
        option.value = model.id;
        option.textContent = model.name;
        modelSelect.appendChild(option);
      });

      const saved = localStorage.getItem(MODEL_KEY);
      if (saved) {
        modelSelect.value = saved;
      }

      updateModelText();
    }

    function updateModelText() {
      const selected = modelSelect.options[modelSelect.selectedIndex];
      currentModelText.textContent = selected ? selected.textContent : "未选择模型";
    }

    modelSelect.addEventListener("change", () => {
      localStorage.setItem(MODEL_KEY, modelSelect.value);
      updateModelText();
    });

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      const session = getCurrentSession();

      setTitleFromMessage(text);
      addMessageToDOM(text, "user");

      inputEl.value = "";
      autoResize();
      sendBtn.disabled = true;

      const typingBubble = addTypingBubble();

      const history = session.messages
        .filter(m => m.role === "user" || m.role === "assistant")
        .slice(-12);

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text,
            model: modelSelect.value || "deepseek/deepseek-v4-flash:free",
            history: history,
            max_tokens: Number(maxTokens.value || 1024)
          })
        });

        const data = await response.json();

        if (data.reply) {
          typingBubble.innerHTML = simpleMarkdown(data.reply);

          session.messages.push({
            role: "assistant",
            content: data.reply
          });

          saveSessions();
          renderAll();
        } else {
          typingBubble.textContent = "请求失败：" + (data.error || JSON.stringify(data));
        }
      } catch (err) {
        typingBubble.textContent = "请求失败：" + err.message;
      }

      sendBtn.disabled = false;
      inputEl.focus();
      scrollBottom();
    }

    async function copyCurrentChat() {
      const session = getCurrentSession();

      if (!session.messages.length) return;

      const text = session.messages
        .map(m => `${m.role === "user" ? "用户" : "AI"}：${m.content}`)
        .join("\n\n");

      await navigator.clipboard.writeText(text);
      alert("当前会话已复制");
    }

    function usePrompt(text) {
      inputEl.value = text;
      autoResize();
      inputEl.focus();
    }

    function autoResize() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px";
    }

    inputEl.addEventListener("input", autoResize);

    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    loadTheme();
    loadSessions();
    loadModels();
    autoResize();
  </script>
</body>
</html>
