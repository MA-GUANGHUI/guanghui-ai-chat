<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaGary AI</title>

  <style>
    :root {
      --bg: #f7f7f8;
      --surface: #ffffff;
      --surface-2: #f3f4f6;
      --surface-3: #eef0f3;
      --text: #111827;
      --muted: #6b7280;
      --muted-2: #9ca3af;
      --border: #e5e7eb;
      --primary: #111827;
      --primary-soft: #11182712;
      --accent: #7c3aed;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 12px 32px rgba(17, 24, 39, 0.08);
      --shadow-lg: 0 24px 80px rgba(17, 24, 39, 0.15);
      --sidebar-width: 292px;
      --sidebar-collapsed-width: 64px;
      --radius: 18px;
    }

    body.dark {
      --bg: #0b0f17;
      --surface: #111827;
      --surface-2: #161f2f;
      --surface-3: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --muted-2: #6b7280;
      --border: #253044;
      --primary: #f9fafb;
      --primary-soft: #ffffff12;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      --shadow-lg: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button, input, textarea, select { font-family: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .auth-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 28% 20%, rgba(124, 58, 237, 0.14), transparent 28%),
        radial-gradient(circle at 70% 16%, rgba(16, 185, 129, 0.12), transparent 25%),
        var(--bg);
    }

    .auth-card {
      width: 390px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 30px;
      box-shadow: var(--shadow-lg);
    }

    .auth-logo {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 21px;
      font-weight: 900;
      background: linear-gradient(135deg, #111827, #7c3aed);
      box-shadow: 0 14px 32px rgba(124, 58, 237, 0.28);
      margin-bottom: 18px;
    }

    .auth-card h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -0.8px;
    }

    .auth-card p {
      margin: 10px 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .auth-card input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 15px;
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--surface-2);
      outline: none;
      font-size: 15px;
      transition: 0.18s;
    }

    .auth-card input:focus {
      background: var(--surface);
      border-color: #7c3aed88;
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
    }

    .auth-card button {
      margin-top: 14px;
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 14px;
      cursor: pointer;
      color: white;
      background: #111827;
      font-weight: 800;
      font-size: 15px;
      transition: 0.18s;
    }

    .auth-card button:hover { transform: translateY(-1px); background: #000; }
    body.dark .auth-card button { background: #f9fafb; color: #111827; }
    body.dark .auth-card button:hover { background: #fff; }

    .auth-error {
      margin-top: 12px;
      min-height: 18px;
      font-size: 13px;
      color: var(--danger);
    }

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    .sidebar {
      width: var(--sidebar-width);
      flex: 0 0 var(--sidebar-width);
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      transition: width 0.22s ease, flex-basis 0.22s ease, padding 0.22s ease;
      z-index: 20;
    }

    body.sidebar-collapsed .sidebar {
      width: var(--sidebar-collapsed-width);
      flex-basis: var(--sidebar-collapsed-width);
      padding: 12px 8px;
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
    }

    body.sidebar-collapsed .sidebar-head {
      justify-content: center;
      flex-direction: column;
      gap: 10px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 900;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      box-shadow: 0 10px 26px rgba(37, 99, 235, 0.22);
      flex: 0 0 auto;
    }

    body.sidebar-collapsed .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 14px;
    }

    .brand-text { min-width: 0; flex: 1; }
    .brand-title { font-size: 21px; font-weight: 900; letter-spacing: -0.8px; white-space: nowrap; }
    .brand-subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; }

    body.sidebar-collapsed .brand-text { display: none; }

    .sidebar-toggle {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: 0.18s;
      position: relative;
    }

    .sidebar-toggle:hover { background: var(--surface-3); transform: translateY(-1px); }
    body.sidebar-collapsed .sidebar-toggle { width: 38px; height: 34px; }

    .toggle-bars,
    .toggle-arrow { position: absolute; inset: 0; display: grid; place-items: center; }
    .toggle-arrow { display: none; font-size: 18px; font-weight: 900; }
    body.sidebar-collapsed .toggle-bars { display: none; }
    body.sidebar-collapsed .toggle-arrow { display: grid; }

    .new-chat {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      background: var(--text);
      color: var(--surface);
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      transition: 0.18s;
    }

    .new-chat:hover { transform: translateY(-1px); opacity: 0.94; }
    body.dark .new-chat { background: #f9fafb; color: #111827; }

    body.sidebar-collapsed .new-chat {
      padding: 0;
      width: 42px;
      height: 42px;
      border-radius: 15px;
      align-self: center;
    }
    body.sidebar-collapsed .new-chat span { display: none; }

    .section-title {
      padding: 8px 4px 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    body.sidebar-collapsed .section-title { display: none; }

    .chat-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 2px;
    }

    .chat-list::-webkit-scrollbar,
    .chat-area::-webkit-scrollbar,
    .model-menu-list::-webkit-scrollbar { width: 8px; }
    .chat-list::-webkit-scrollbar-thumb,
    .chat-area::-webkit-scrollbar-thumb,
    .model-menu-list::-webkit-scrollbar-thumb { background: #9ca3af55; border-radius: 999px; }

    .chat-item {
      border: none;
      background: transparent;
      color: var(--text);
      width: 100%;
      padding: 10px;
      border-radius: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 9px;
      text-align: left;
      transition: 0.16s;
    }

    .chat-item:hover,
    .chat-item.active { background: var(--surface-2); }

    .chat-icon {
      width: 28px;
      height: 28px;
      border-radius: 10px;
      background: var(--surface-3);
      color: var(--muted);
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      font-size: 12px;
    }

    .chat-item.active .chat-icon { background: #111827; color: #fff; }
    body.dark .chat-item.active .chat-icon { background: #f9fafb; color: #111827; }

    .chat-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 600;
    }

    .delete-btn {
      opacity: 0;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      width: 22px;
      height: 22px;
      border-radius: 8px;
      display: grid;
      place-items: center;
    }
    .chat-item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { background: var(--surface-3); color: var(--danger); }

    body.sidebar-collapsed .chat-item { justify-content: center; padding: 8px 0; }
    body.sidebar-collapsed .chat-name,
    body.sidebar-collapsed .delete-btn { display: none; }
    body.sidebar-collapsed .chat-icon { width: 34px; height: 34px; }

    .sidebar-bottom {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    body.sidebar-collapsed .sidebar-bottom { display: none; }

    .small-action {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 13px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: 0.16s;
    }
    .small-action:hover { background: var(--surface-2); }

    .main {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .topbar {
      height: 68px;
      flex: 0 0 auto;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 24px;
      z-index: 10;
    }

    .title-area { min-width: 0; }
    .current-title { font-size: 16px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 420px; }
    .current-model { margin-top: 3px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 520px; }

    .top-controls { display: flex; align-items: center; gap: 10px; }

    .model-picker { position: relative; width: 360px; }

    .model-trigger {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 16px;
      padding: 7px 10px 7px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 18px rgba(17, 24, 39, 0.05);
      transition: 0.16s;
    }
    .model-trigger:hover { background: var(--surface-2); }

    .model-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
      flex: 0 0 auto;
    }

    .model-trigger-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; text-align: left; }
    .model-trigger-name { font-size: 13px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .model-trigger-meta { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .model-chevron { color: var(--muted); transition: transform 0.16s; font-weight: 900; }
    .model-picker.open .model-chevron { transform: rotate(180deg); }

    .model-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 430px;
      max-width: calc(100vw - 32px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      padding: 10px;
      z-index: 1000;
    }
    .model-picker.open .model-menu { display: block; animation: menuIn 0.14s ease; }
    @keyframes menuIn { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .model-search {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 10px;
    }
    .model-search span { color: var(--muted); }
    .model-search input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-size: 14px; }

    .model-menu-list { max-height: 390px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding-right: 3px; }

    .model-option {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      padding: 10px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      transition: 0.14s;
    }
    .model-option:hover { background: var(--surface-2); }
    .model-option.active { background: var(--primary-soft); border-color: var(--border); }

    .model-badge-icon {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: var(--surface-2);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: var(--text);
      font-size: 12px;
      font-weight: 900;
    }
    .model-option.active .model-badge-icon { background: #111827; color: white; }
    body.dark .model-option.active .model-badge-icon { background: #f9fafb; color: #111827; }

    .model-info { min-width: 0; flex: 1; }
    .model-name { font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .model-id { margin-top: 3px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .model-tag {
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 900;
      padding: 4px 7px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
    }
    .model-tag.openrouter { color: #1d4ed8; background: rgba(37, 99, 235, 0.11); }
    .model-tag.cerebras { color: #7c3aed; background: rgba(124, 58, 237, 0.12); }
    .model-tag.nvidia { color: #047857; background: rgba(16, 185, 129, 0.12); }
    .model-tag.custom { color: #92400e; background: rgba(245, 158, 11, 0.13); }

    .model-empty { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }

    .btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 13px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.16s;
    }
    .btn:hover { background: var(--surface-2); }

    .chat-area { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 148px; }

    .welcome { max-width: 860px; margin: 0 auto; padding: 92px 24px 24px; text-align: center; }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
      box-shadow: 0 6px 18px rgba(17, 24, 39, 0.04);
      margin-bottom: 18px;
    }
    .hero-badge span { width: 8px; height: 8px; background: var(--success); border-radius: 50%; }
    .welcome h1 {
      margin: 0;
      font-size: 54px;
      line-height: 1.05;
      letter-spacing: -2px;
      background: linear-gradient(135deg, var(--text), #4f46e5 55%, #7c3aed);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .welcome p { margin: 16px auto 0; max-width: 570px; color: var(--muted); line-height: 1.8; font-size: 15px; }

    .prompt-grid { margin-top: 34px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .prompt-card {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 18px;
      padding: 16px;
      cursor: pointer;
      text-align: left;
      transition: 0.16s;
      box-shadow: 0 8px 24px rgba(17, 24, 39, 0.04);
    }
    .prompt-card:hover { background: var(--surface-2); transform: translateY(-2px); }
    .prompt-card strong { display: block; font-size: 14px; margin-bottom: 6px; }
    .prompt-card span { color: var(--muted); font-size: 13px; line-height: 1.6; }

    .messages { max-width: 900px; margin: 0 auto; padding: 34px 24px; }
    .msg { display: flex; gap: 12px; margin-bottom: 24px; animation: fadeUp 0.2s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .msg.user { justify-content: flex-end; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: #111827;
      color: white;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font-size: 12px;
      font-weight: 900;
      margin-top: 2px;
    }
    body.dark .avatar { background: #f9fafb; color: #111827; }
    .msg.user .avatar { display: none; }

    .bubble-wrap { max-width: 78%; min-width: 0; }
    .bubble {
      position: relative;
      padding: 15px 17px;
      border-radius: 18px;
      line-height: 1.78;
      font-size: 15px;
      word-break: break-word;
      white-space: pre-wrap;
      box-shadow: 0 8px 24px rgba(17, 24, 39, 0.04);
    }
    .msg.assistant .bubble { background: var(--surface); border: 1px solid var(--border); padding-right: 52px; border-bottom-left-radius: 7px; }
    .msg.user .bubble { background: #111827; color: white; border-bottom-right-radius: 7px; }
    body.dark .msg.user .bubble { background: #f9fafb; color: #111827; }

    .copy-floating {
      position: absolute;
      right: 10px;
      top: 10px;
      width: 30px;
      height: 30px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      border-radius: 10px;
      cursor: pointer;
      display: grid;
      place-items: center;
      opacity: 0.78;
      transition: 0.14s;
    }
    .copy-floating:hover { opacity: 1; color: var(--text); background: var(--surface-3); }

    pre { background: var(--surface-2); border: 1px solid var(--border); padding: 12px; border-radius: 12px; overflow-x: auto; white-space: pre; }
    code { font-family: Consolas, Monaco, monospace; font-size: 14px; }

    .composer-wrap {
      position: fixed;
      left: var(--sidebar-width);
      right: 0;
      bottom: 0;
      padding: 20px 24px 24px;
      background: linear-gradient(to top, var(--bg) 72%, transparent);
      transition: left 0.22s ease;
      z-index: 15;
    }
    body.sidebar-collapsed .composer-wrap { left: var(--sidebar-collapsed-width); }

    .composer {
      max-width: 900px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 13px 13px 9px 17px;
    }
    .composer-inner { display: flex; align-items: flex-end; gap: 12px; }
    textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--text);
      min-height: 36px;
      max-height: 190px;
      line-height: 1.6;
      font-size: 15px;
      padding: 5px 0;
    }
    textarea::placeholder { color: var(--muted-2); }
    .send-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 15px;
      background: #111827;
      color: #fff;
      cursor: pointer;
      font-size: 20px;
      transition: 0.16s;
      flex: 0 0 auto;
    }
    .send-btn:hover { transform: translateY(-1px); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    body.dark .send-btn { background: #f9fafb; color: #111827; }

    .composer-foot { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .token-select { border: none; background: transparent; color: var(--muted); outline: none; cursor: pointer; font-size: 12px; }

    .typing { display: inline-flex; gap: 5px; align-items: center; height: 20px; }
    .typing span { width: 7px; height: 7px; background: var(--muted); border-radius: 50%; animation: pulse 1.3s infinite ease-in-out; }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: 0.35; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-5px); } }

    @media (max-width: 900px) {
      .sidebar { position: fixed; inset: 0 auto 0 0; transform: translateX(-100%); }
      body.mobile-sidebar-open .sidebar { transform: translateX(0); }
      body.sidebar-collapsed .sidebar { width: var(--sidebar-width); flex-basis: var(--sidebar-width); }
      .composer-wrap, body.sidebar-collapsed .composer-wrap { left: 0; }
      .topbar { padding: 0 14px; }
      .model-picker { width: min(260px, 52vw); }
      .model-menu { right: -50px; width: 360px; }
      .prompt-grid { grid-template-columns: 1fr; }
      .bubble-wrap { max-width: 88%; }
      .welcome h1 { font-size: 40px; }
      .current-title { max-width: 180px; }
    }
  </style>
</head>
<body>
  <div class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="auth-logo">M</div>
      <h1>MaGary AI</h1>
      <p id="authTip">正在检查访问权限...</p>
      <input id="passwordInput" type="password" placeholder="请输入访问密码" />
      <button onclick="login()">进入 MaGary AI</button>
      <div class="auth-error" id="authError"></div>
    </div>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="brand-mark">M</div>
        <div class="brand-text">
          <div class="brand-title">MaGary AI</div>
          <div class="brand-subtitle">Private AI Workspace</div>
        </div>
        <button class="sidebar-toggle" onclick="toggleSidebar()" title="展开 / 收起">
          <span class="toggle-bars">☰</span>
          <span class="toggle-arrow">›</span>
        </button>
      </div>

      <button class="new-chat" onclick="newChat()"><strong>＋</strong><span>新建聊天</span></button>

      <div class="section-title">会话</div>
      <div class="chat-list" id="chatList"></div>

      <div class="sidebar-bottom">
        <button class="small-action" onclick="copyCurrentChat()">复制当前会话</button>
        <button class="small-action" onclick="clearCurrentChat()">清空当前会话</button>
        <button class="small-action" onclick="logout()">退出访问</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-area">
          <div class="current-title" id="currentTitle">新聊天</div>
          <div class="current-model" id="currentModelText">准备就绪</div>
        </div>

        <div class="top-controls">
          <div class="model-picker" id="modelPicker">
            <button class="model-trigger" onclick="toggleModelMenu()" type="button">
              <span class="model-dot"></span>
              <span class="model-trigger-main">
                <span class="model-trigger-name" id="modelTriggerName">加载模型中...</span>
                <span class="model-trigger-meta" id="modelTriggerMeta">读取渠道...</span>
              </span>
              <span class="model-chevron">⌄</span>
            </button>
            <div class="model-menu" id="modelMenu">
              <div class="model-search">
                <span>⌕</span>
                <input id="modelSearchInput" type="text" placeholder="搜索模型或渠道" />
              </div>
              <div class="model-menu-list" id="modelMenuList"></div>
            </div>
          </div>
          <button class="btn" onclick="toggleTheme()">主题</button>
        </div>
      </header>

      <section class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <div class="hero-badge"><span></span> Multi Provider · Ready</div>
          <h1>MaGary AI</h1>
          <p>你的私人 AI 工作台。选择模型，输入问题，然后让机器替人类分担一点点脑力劳动。</p>
          <div class="prompt-grid">
            <div class="prompt-card" onclick="usePrompt('请简单介绍一下你自己')"><strong>快速开始</strong><span>让当前模型介绍自己</span></div>
            <div class="prompt-card" onclick="usePrompt('请解释一下 FastAPI、前端页面、OpenRouter、Cerebras、NVIDIA API 之间的关系')"><strong>项目逻辑</strong><span>理解多渠道 API 项目结构</span></div>
            <div class="prompt-card" onclick="usePrompt('请帮我优化这个 AI Chat 项目的代码结构')"><strong>代码优化</strong><span>改进项目文件组织和功能</span></div>
            <div class="prompt-card" onclick="usePrompt('请用简单例子讲解前端 fetch 如何调用后端接口')"><strong>接口调用</strong><span>学习前后端通信逻辑</span></div>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-wrap">
        <div class="composer">
          <div class="composer-inner">
            <textarea id="input" rows="1" placeholder="给 MaGary AI 发送消息"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
          </div>
          <div class="composer-foot">
            <span>Enter 发送，Shift + Enter 换行</span>
            <select id="maxTokens" class="token-select">
              <option value="512">512 tokens</option>
              <option value="1024" selected>1024 tokens</option>
              <option value="2048">2048 tokens</option>
              <option value="4096">4096 tokens</option>
            </select>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "magary_ai_chat_sessions_v2";
    const THEME_KEY = "magary_ai_theme";
    const MODEL_KEY = "magary_ai_selected_model";
    const PASSWORD_KEY = "magary_ai_access_password";
    const SIDEBAR_KEY = "magary_ai_sidebar_collapsed";

    const authScreen = document.getElementById("authScreen");
    const authTip = document.getElementById("authTip");
    const passwordInput = document.getElementById("passwordInput");
    const authError = document.getElementById("authError");
    const chatListEl = document.getElementById("chatList");
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const chatArea = document.getElementById("chatArea");
    const welcome = document.getElementById("welcome");
    const currentTitle = document.getElementById("currentTitle");
    const currentModelText = document.getElementById("currentModelText");
    const maxTokens = document.getElementById("maxTokens");
    const modelPicker = document.getElementById("modelPicker");
    const modelTriggerName = document.getElementById("modelTriggerName");
    const modelTriggerMeta = document.getElementById("modelTriggerMeta");
    const modelMenuList = document.getElementById("modelMenuList");
    const modelSearchInput = document.getElementById("modelSearchInput");

    let sessions = [];
    let currentId = null;
    let models = [];
    let selectedModelId = "openrouter/free";

    const fallbackModels = [
      { id: "openrouter/free", name: "OpenRouter Free", provider: "openrouter", channel: "OpenRouter" },
      { id: "cerebras/gpt-oss-120b", name: "Cerebras GPT OSS 120B", provider: "cerebras", channel: "Cerebras" },
      { id: "nvidia/meta-llama-3.1-70b-instruct", name: "NVIDIA Llama 3.1 70B", provider: "nvidia", channel: "NVIDIA" }
    ];

    function normalizeProvider(model) {
      const raw = String(model.provider || model.channel || "openrouter").toLowerCase();
      if (raw.includes("nvidia") || model.id.toLowerCase().startsWith("nvidia/")) return "NVIDIA";
      if (raw.includes("cerebras") || model.id.toLowerCase().startsWith("cerebras/")) return "Cerebras";
      if (raw.includes("openrouter")) return "OpenRouter";
      return model.channel || model.provider || "Custom";
    }

    function providerClass(model) {
      const p = normalizeProvider(model).toLowerCase();
      if (p.includes("nvidia")) return "nvidia";
      if (p.includes("cerebras")) return "cerebras";
      if (p.includes("openrouter")) return "openrouter";
      return "custom";
    }

    function providerShort(model) { return normalizeProvider(model); }

    function modelInitial(model) {
      const n = (model.name + " " + model.id).toLowerCase();
      if (n.includes("nvidia")) return "NV";
      if (n.includes("cerebras")) return "CB";
      if (n.includes("deepseek")) return "D";
      if (n.includes("claude")) return "C";
      if (n.includes("gemini")) return "G";
      if (n.includes("qwen")) return "Q";
      if (n.includes("grok")) return "X";
      if (n.includes("gpt") || n.includes("openai")) return "G";
      return "AI";
    }

    function getPassword() { return sessionStorage.getItem(PASSWORD_KEY) || ""; }
    function setPassword(pwd) { sessionStorage.setItem(PASSWORD_KEY, pwd); }
    function clearPassword() { sessionStorage.removeItem(PASSWORD_KEY); }

    async function initAuth() {
      authScreen.style.display = "flex";
      authTip.textContent = "正在检查访问权限...";
      passwordInput.style.display = "none";
      try {
        const res = await fetch("/auth/status");
        const data = await res.json();
        if (!data.password_required) { authScreen.style.display = "none"; return; }
        const saved = getPassword();
        if (saved && await verifyPassword(saved, false)) { authScreen.style.display = "none"; return; }
        clearPassword();
        showLoginBox();
      } catch (err) {
        authTip.textContent = "权限检查失败，请刷新页面";
        authError.textContent = err.message;
      }
    }

    function showLoginBox() {
      authTip.textContent = "请输入访问密码";
      passwordInput.style.display = "block";
      passwordInput.value = "";
      authError.textContent = "";
      setTimeout(() => passwordInput.focus(), 100);
    }

    async function verifyPassword(pwd, showError = true) {
      try {
        const res = await fetch("/auth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pwd }) });
        if (res.ok) return true;
        if (showError) authError.textContent = "密码错误";
        return false;
      } catch (err) {
        if (showError) authError.textContent = "验证失败：" + err.message;
        return false;
      }
    }

    async function login() {
      const pwd = passwordInput.value.trim();
      if (!pwd) { authError.textContent = "请输入密码"; return; }
      if (await verifyPassword(pwd, true)) { setPassword(pwd); authScreen.style.display = "none"; inputEl.focus(); }
    }

    function logout() { clearPassword(); showLoginBox(); authScreen.style.display = "flex"; }
    passwordInput.addEventListener("keydown", e => { if (e.key === "Enter") login(); });

    function uid() { return "chat_" + Date.now() + "_" + Math.random().toString(16).slice(2); }
    function loadTheme() { if (localStorage.getItem(THEME_KEY) === "dark") document.body.classList.add("dark"); }
    function toggleTheme() { document.body.classList.toggle("dark"); localStorage.setItem(THEME_KEY, document.body.classList.contains("dark") ? "dark" : "light"); }
    function loadSidebarState() { if (localStorage.getItem(SIDEBAR_KEY) === "true") document.body.classList.add("sidebar-collapsed"); }
    function toggleSidebar() { document.body.classList.toggle("sidebar-collapsed"); localStorage.setItem(SIDEBAR_KEY, document.body.classList.contains("sidebar-collapsed") ? "true" : "false"); }

    function loadSessions() {
      try { sessions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { sessions = []; }
      if (!sessions.length) sessions.push({ id: uid(), title: "新聊天", messages: [] });
      currentId = sessions[0].id;
      saveSessions();
      renderAll();
    }
    function saveSessions() { localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); }
    function getCurrentSession() { return sessions.find(s => s.id === currentId); }

    function renderChatList() {
      chatListEl.innerHTML = "";
      sessions.forEach(session => {
        const item = document.createElement("button");
        item.className = "chat-item" + (session.id === currentId ? " active" : "");
        const icon = document.createElement("div"); icon.className = "chat-icon"; icon.textContent = "✦";
        const name = document.createElement("div"); name.className = "chat-name"; name.textContent = session.title || "新聊天";
        const del = document.createElement("button"); del.className = "delete-btn"; del.textContent = "×";
        del.onclick = e => { e.stopPropagation(); deleteSession(session.id); };
        item.onclick = () => { currentId = session.id; renderAll(); };
        item.append(icon, name, del);
        chatListEl.appendChild(item);
      });
    }

    function renderMessages() {
      const session = getCurrentSession();
      messagesEl.innerHTML = "";
      currentTitle.textContent = session.title || "新聊天";
      if (!session.messages.length) { welcome.style.display = "block"; return; }
      welcome.style.display = "none";
      session.messages.forEach(msg => addMessageToDOM(msg.content, msg.role, false));
      scrollBottom();
    }
    function renderAll() { renderChatList(); renderMessages(); }
    function newChat() { sessions.unshift({ id: uid(), title: "新聊天", messages: [] }); currentId = sessions[0].id; saveSessions(); renderAll(); inputEl.focus(); }
    function deleteSession(id) { sessions = sessions.filter(s => s.id !== id); if (!sessions.length) sessions.push({ id: uid(), title: "新聊天", messages: [] }); if (currentId === id) currentId = sessions[0].id; saveSessions(); renderAll(); }
    function clearCurrentChat() { const s = getCurrentSession(); s.messages = []; s.title = "新聊天"; saveSessions(); renderAll(); }
    function setTitleFromMessage(text) { const s = getCurrentSession(); if (s.title === "新聊天") s.title = text.slice(0, 22) + (text.length > 22 ? "..." : ""); }
    function scrollBottom() { chatArea.scrollTop = chatArea.scrollHeight; }
    function escapeHtml(text) { const div = document.createElement("div"); div.textContent = text; return div.innerHTML; }
    function simpleMarkdown(text) { let html = escapeHtml(text); html = html.replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>"); html = html.replace(/`([^`]+)`/g, "<code>$1</code>"); html = html.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>"); html = html.replace(/\n/g, "<br>"); return html; }

    function addMessageToDOM(content, role, save = true) {
      welcome.style.display = "none";
      const msg = document.createElement("div"); msg.className = "msg " + role;
      if (role === "assistant") { const avatar = document.createElement("div"); avatar.className = "avatar"; avatar.textContent = "AI"; msg.appendChild(avatar); }
      const wrap = document.createElement("div"); wrap.className = "bubble-wrap";
      const bubble = document.createElement("div"); bubble.className = "bubble"; bubble.innerHTML = simpleMarkdown(content);
      if (role === "assistant") {
        const copy = document.createElement("button"); copy.className = "copy-floating"; copy.textContent = "⧉"; copy.title = "复制回答";
        copy.onclick = async () => { await navigator.clipboard.writeText(content); copy.textContent = "✓"; setTimeout(() => copy.textContent = "⧉", 900); };
        bubble.appendChild(copy);
      }
      wrap.appendChild(bubble); msg.appendChild(wrap); messagesEl.appendChild(msg); scrollBottom();
      if (save) { const s = getCurrentSession(); s.messages.push({ role, content }); saveSessions(); renderChatList(); }
      return bubble;
    }

    function addTypingBubble() {
      welcome.style.display = "none";
      const msg = document.createElement("div"); msg.className = "msg assistant";
      const avatar = document.createElement("div"); avatar.className = "avatar"; avatar.textContent = "AI";
      const wrap = document.createElement("div"); wrap.className = "bubble-wrap";
      const bubble = document.createElement("div"); bubble.className = "bubble"; bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      wrap.appendChild(bubble); msg.append(avatar, wrap); messagesEl.appendChild(msg); scrollBottom(); return bubble;
    }

    async function loadModels() {
      try { const res = await fetch("/models"); const data = await res.json(); models = data.models && data.models.length ? data.models : fallbackModels; }
      catch { models = fallbackModels; }
      const saved = localStorage.getItem(MODEL_KEY);
      selectedModelId = saved || "openrouter/free";
      if (!models.some(m => m.id === selectedModelId)) selectedModelId = models[0]?.id || "openrouter/free";
      renderModelMenu(); updateSelectedModelUI();
    }

    function toggleModelMenu() { modelPicker.classList.toggle("open"); if (modelPicker.classList.contains("open")) { modelSearchInput.value = ""; renderModelMenu(); setTimeout(() => modelSearchInput.focus(), 80); } }
    function closeModelMenu() { modelPicker.classList.remove("open"); }

    function renderModelMenu() {
      const keyword = modelSearchInput.value.trim().toLowerCase();
      const filtered = models.filter(m => m.name.toLowerCase().includes(keyword) || m.id.toLowerCase().includes(keyword) || normalizeProvider(m).toLowerCase().includes(keyword));
      modelMenuList.innerHTML = "";
      if (!filtered.length) { const empty = document.createElement("div"); empty.className = "model-empty"; empty.textContent = "没有找到匹配模型"; modelMenuList.appendChild(empty); return; }
      filtered.forEach(model => {
        const option = document.createElement("button"); option.type = "button"; option.className = "model-option" + (model.id === selectedModelId ? " active" : "");
        const icon = document.createElement("div"); icon.className = "model-badge-icon"; icon.textContent = modelInitial(model);
        const info = document.createElement("div"); info.className = "model-info";
        const name = document.createElement("div"); name.className = "model-name"; name.textContent = model.name;
        const id = document.createElement("div"); id.className = "model-id"; id.textContent = normalizeProvider(model);
        info.append(name, id);
        const tag = document.createElement("div"); tag.className = "model-tag " + providerClass(model); tag.textContent = providerShort(model);
        option.append(icon, info, tag);
        option.onclick = () => { selectedModelId = model.id; localStorage.setItem(MODEL_KEY, selectedModelId); updateSelectedModelUI(); renderModelMenu(); closeModelMenu(); };
        modelMenuList.appendChild(option);
      });
    }

    function updateSelectedModelUI() {
      const selected = models.find(m => m.id === selectedModelId) || models[0];
      if (!selected) { modelTriggerName.textContent = "未选择模型"; modelTriggerMeta.textContent = "未读取到渠道"; currentModelText.textContent = "未选择模型"; return; }
      modelTriggerName.textContent = selected.name;
      modelTriggerMeta.textContent = normalizeProvider(selected);
      currentModelText.textContent = `${selected.name} · ${normalizeProvider(selected)}`;
    }

    modelSearchInput.addEventListener("input", renderModelMenu);
    document.addEventListener("click", e => { if (!modelPicker.contains(e.target)) closeModelMenu(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeModelMenu(); });

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      const session = getCurrentSession();
      const history = session.messages.filter(m => m.role === "user" || m.role === "assistant").slice(-10);
      setTitleFromMessage(text); addMessageToDOM(text, "user"); inputEl.value = ""; autoResize(); sendBtn.disabled = true;
      const typingBubble = addTypingBubble();
      try {
        const response = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text, model: selectedModelId || "openrouter/free", history, max_tokens: Number(maxTokens.value || 1024), password: getPassword() }) });
        const data = await response.json();
        if (response.status === 401) { clearPassword(); showLoginBox(); authScreen.style.display = "flex"; typingBubble.textContent = "访问密码错误，请重新登录"; return; }
        if (data.reply) {
          typingBubble.innerHTML = simpleMarkdown(data.reply);
          const copy = document.createElement("button"); copy.className = "copy-floating"; copy.textContent = "⧉"; copy.title = "复制回答";
          copy.onclick = async () => { await navigator.clipboard.writeText(data.reply); copy.textContent = "✓"; setTimeout(() => copy.textContent = "⧉", 900); };
          typingBubble.appendChild(copy);
          session.messages.push({ role: "assistant", content: data.reply }); saveSessions(); renderAll();
        } else typingBubble.textContent = "请求失败：" + (data.error || JSON.stringify(data));
      } catch (err) { typingBubble.textContent = "请求失败：" + err.message; }
      sendBtn.disabled = false; inputEl.focus(); scrollBottom();
    }

    async function copyCurrentChat() {
      const s = getCurrentSession(); if (!s.messages.length) return;
      const text = s.messages.map(m => `${m.role === "user" ? "用户" : "AI"}：${m.content}`).join("\n\n");
      await navigator.clipboard.writeText(text); alert("当前会话已复制");
    }
    function usePrompt(text) { inputEl.value = text; autoResize(); inputEl.focus(); }
    function autoResize() { inputEl.style.height = "auto"; inputEl.style.height = Math.min(inputEl.scrollHeight, 190) + "px"; }
    inputEl.addEventListener("input", autoResize);
    inputEl.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

    loadTheme(); loadSidebarState(); loadSessions(); loadModels(); initAuth(); autoResize();
  </script>
</body>
</html>
