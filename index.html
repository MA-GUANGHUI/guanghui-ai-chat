<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaGary AI</title>
  <style>
    :root {
      --bg: #111111;
      --sidebar: #090909;
      --sidebar-2: #0d0d0d;
      --panel: #181818;
      --panel-2: #202020;
      --panel-3: #2a2a2a;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --muted-2: #6b7280;
      --border: #2c2c2c;
      --border-2: #3a3a3a;
      --primary: #ffffff;
      --bubble-user: #2d2d2d;
      --bubble-ai: transparent;
      --danger: #ef4444;
      --green: #22c55e;
      --shadow: rgba(0,0,0,.35);
      --side-w: 244px;
      --side-collapsed: 62px;
      --composer-w: 720px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button, textarea, input { font-family: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .auth-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, rgba(255,255,255,.08), transparent 38%), var(--bg);
      padding: 22px;
    }

    .auth-card {
      width: 390px;
      background: #171717;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
    }

    .auth-logo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #fff;
      color: #111;
      display: grid;
      place-items: center;
      font-weight: 900;
      margin-bottom: 16px;
    }

    .auth-card h1 { margin: 0; font-size: 25px; letter-spacing: -.4px; }
    .auth-card p { margin: 8px 0 20px; color: var(--muted); font-size: 14px; line-height: 1.6; }

    .auth-card input {
      width: 100%;
      border: 1px solid var(--border-2);
      background: #0f0f0f;
      color: var(--text);
      border-radius: 14px;
      padding: 13px 14px;
      outline: none;
      font-size: 14px;
    }

    .auth-card input:focus { border-color: #777; }

    .auth-card button {
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 14px;
      background: #fff;
      color: #111;
      font-weight: 800;
      padding: 13px;
      cursor: pointer;
    }

    .auth-error { min-height: 18px; margin-top: 12px; color: var(--danger); font-size: 13px; }

    .app { display: flex; width: 100vw; height: 100vh; }

    .sidebar {
      width: var(--side-w);
      flex-shrink: 0;
      height: 100vh;
      background: var(--sidebar);
      border-right: 1px solid #141414;
      display: flex;
      flex-direction: column;
      padding: 10px;
      transition: width .22s ease, padding .22s ease;
      position: relative;
      z-index: 30;
    }

    body.sidebar-collapsed .sidebar { width: var(--side-collapsed); padding: 10px 8px; }

    .side-top {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      margin-bottom: 12px;
    }

    .app-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      color: #111;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .app-name { font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; }

    .collapse-btn {
      margin-left: auto;
      width: 30px;
      height: 30px;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 9px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: .15s;
    }

    .collapse-btn:hover { background: #191919; color: #fff; }
    .collapse-icon-expanded { display: block; }
    .collapse-icon-collapsed { display: none; }

    body.sidebar-collapsed .app-name,
    body.sidebar-collapsed .nav-label,
    body.sidebar-collapsed .side-section-title,
    body.sidebar-collapsed .chat-title,
    body.sidebar-collapsed .chat-date,
    body.sidebar-collapsed .profile-text,
    body.sidebar-collapsed .collapse-icon-expanded { display: none; }

    body.sidebar-collapsed .collapse-icon-collapsed { display: block; }
    body.sidebar-collapsed .side-top { justify-content: center; }
    body.sidebar-collapsed .collapse-btn { position: absolute; top: 52px; left: 16px; margin: 0; }

    .nav { display: flex; flex-direction: column; gap: 4px; }

    .nav-btn {
      height: 34px;
      border: 0;
      background: transparent;
      color: #e5e7eb;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px;
      cursor: pointer;
      font-size: 14px;
      text-align: left;
      transition: .15s;
    }

    .nav-btn:hover { background: #171717; }
    .nav-icon { width: 18px; text-align: center; color: #d1d5db; flex-shrink: 0; }
    body.sidebar-collapsed .nav-btn { justify-content: center; padding: 0; }

    .side-section-title {
      color: var(--muted);
      font-size: 12px;
      margin: 18px 6px 8px;
    }

    .chat-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-right: 2px;
    }

    .chat-list::-webkit-scrollbar, .main-scroll::-webkit-scrollbar, .model-list::-webkit-scrollbar { width: 7px; }
    .chat-list::-webkit-scrollbar-thumb, .main-scroll::-webkit-scrollbar-thumb, .model-list::-webkit-scrollbar-thumb { background: #303030; border-radius: 999px; }

    .chat-item {
      min-height: 34px;
      border: 0;
      width: 100%;
      background: transparent;
      color: #d1d5db;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      cursor: pointer;
      text-align: left;
      transition: .15s;
    }

    .chat-item:hover, .chat-item.active { background: #171717; color: #fff; }
    .chat-glyph { width: 16px; flex-shrink: 0; opacity: .85; }
    .chat-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
    .chat-del { opacity: 0; border: 0; background: transparent; color: #999; cursor: pointer; padding: 3px; border-radius: 6px; }
    .chat-item:hover .chat-del { opacity: 1; }
    .chat-del:hover { background: #252525; color: #fff; }
    body.sidebar-collapsed .chat-item { justify-content: center; padding: 0; }
    body.sidebar-collapsed .chat-del { display: none; }

    .profile {
      min-height: 42px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 6px;
      border-radius: 12px;
      color: #e5e7eb;
    }

    .avatar { width: 26px; height: 26px; border-radius: 50%; background: #f59e0b; color: #111; display: grid; place-items: center; font-size: 12px; font-weight: 900; flex-shrink: 0; }
    .profile-text { min-width: 0; }
    .profile-name { font-size: 13px; font-weight: 700; white-space: nowrap; }
    .profile-sub { font-size: 11px; color: var(--muted); white-space: nowrap; }
    body.sidebar-collapsed .profile { justify-content: center; padding: 7px 0; }

    .main {
      flex: 1;
      min-width: 0;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .topbar {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      flex-shrink: 0;
    }

    .model-picker { position: relative; width: 330px; max-width: 45vw; }

    .model-trigger {
      border: 0;
      background: transparent;
      color: #f3f4f6;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      border-radius: 10px;
      padding: 7px 8px;
      max-width: 100%;
      transition: .15s;
    }

    .model-trigger:hover { background: #1a1a1a; }
    .model-name-top { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .model-provider-top { font-size: 11px; color: var(--muted); margin-top: 1px; text-align: left; }
    .model-trigger-text { min-width: 0; text-align: left; }
    .chev { color: var(--muted); }

    .model-menu {
      position: absolute;
      top: 48px;
      left: 0;
      width: 390px;
      max-width: calc(100vw - 36px);
      background: #1b1b1b;
      border: 1px solid #2c2c2c;
      border-radius: 16px;
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
      padding: 10px;
      display: none;
      z-index: 100;
    }

    .model-picker.open .model-menu { display: block; }

    .model-search {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      background: #111;
      border: 1px solid #303030;
      border-radius: 12px;
      padding: 0 10px;
      margin-bottom: 8px;
      color: var(--muted);
    }

    .model-search input { flex: 1; border: 0; outline: 0; background: transparent; color: #fff; font-size: 13px; }

    .model-list { max-height: 360px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }

    .model-option {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px;
      text-align: left;
      cursor: pointer;
      transition: .15s;
    }

    .model-option:hover, .model-option.active { background: #292929; }
    .model-mark { width: 28px; height: 28px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; font-size: 11px; font-weight: 900; flex-shrink: 0; }
    .model-info { flex: 1; min-width: 0; }
    .model-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .model-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .provider-pill { font-size: 10px; font-weight: 800; color: #111; background: #fff; border-radius: 999px; padding: 4px 7px; flex-shrink: 0; }
    .provider-pill.openrouter { background: #dbeafe; color: #1d4ed8; }
    .provider-pill.cerebras { background: #ede9fe; color: #6d28d9; }
    .provider-pill.nvidia { background: #dcfce7; color: #15803d; }
    .model-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 18px; }

    .top-actions { display: flex; align-items: center; gap: 8px; }
    .ghost-btn { border: 0; width: 32px; height: 32px; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
    .ghost-btn:hover { background: #1a1a1a; color: #fff; }

    .main-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-bottom: 136px;
    }

    .welcome {
      min-height: calc(100vh - 190px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .welcome-inner { width: min(720px, calc(100vw - 340px)); max-width: 720px; }
    body.sidebar-collapsed .welcome-inner { width: min(720px, calc(100vw - 140px)); }

    .hero-title {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .hero-logo { width: 42px; height: 42px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; font-weight: 900; }
    .hero-title h1 { margin: 0; font-size: 30px; letter-spacing: -.6px; font-weight: 750; }

    .suggestions {
      width: min(520px, 100%);
      margin: 26px auto 0;
      color: #d1d5db;
    }

    .suggestions-title { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    .suggestion { padding: 7px 0; cursor: pointer; border-radius: 10px; }
    .suggestion:hover { color: #fff; }
    .suggestion strong { display: block; font-size: 15px; margin-bottom: 2px; }
    .suggestion span { display: block; color: var(--muted); font-size: 12px; }

    .messages {
      width: min(820px, calc(100vw - 310px));
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    body.sidebar-collapsed .messages { width: min(820px, calc(100vw - 110px)); }

    .msg { display: flex; gap: 12px; margin: 22px 0; }
    .msg.user { justify-content: flex-end; }
    .msg-avatar { width: 28px; height: 28px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; font-size: 11px; font-weight: 900; flex-shrink: 0; margin-top: 4px; }
    .msg.user .msg-avatar { display: none; }
    .bubble-wrap { max-width: 78%; position: relative; }
    .bubble { line-height: 1.75; font-size: 15px; white-space: pre-wrap; word-break: break-word; color: #e5e7eb; }
    .msg.user .bubble { background: var(--bubble-user); border-radius: 18px; padding: 10px 14px; color: #fff; }
    .copy-btn { margin-top: 6px; border: 0; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; padding: 4px 0; }
    .copy-btn:hover { color: #fff; }

    pre { background: #0d0d0d; border: 1px solid #2b2b2b; padding: 12px; border-radius: 12px; overflow-x: auto; white-space: pre; }
    code { font-family: Consolas, Monaco, monospace; }

    .composer-wrap {
      position: fixed;
      left: var(--side-w);
      right: 0;
      bottom: 0;
      padding: 0 20px 22px;
      background: linear-gradient(to top, var(--bg) 76%, transparent);
      transition: left .22s ease;
      z-index: 20;
    }

    body.sidebar-collapsed .composer-wrap { left: var(--side-collapsed); }

    .composer {
      width: min(var(--composer-w), calc(100vw - var(--side-w) - 56px));
      margin: 0 auto;
      background: #1b1b1b;
      border: 1px solid #313131;
      border-radius: 21px;
      box-shadow: 0 18px 50px rgba(0,0,0,.28);
      padding: 10px 12px 10px 14px;
    }

    body.sidebar-collapsed .composer { width: min(var(--composer-w), calc(100vw - var(--side-collapsed) - 56px)); }

    .composer textarea {
      width: 100%;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      color: #fff;
      min-height: 34px;
      max-height: 160px;
      padding: 4px 0 8px;
      font-size: 15px;
      line-height: 1.55;
    }

    .composer textarea::placeholder { color: #8b8b8b; }

    .composer-bottom { display: flex; align-items: center; justify-content: space-between; }
    .tool-row { display: flex; align-items: center; gap: 6px; }
    .tool-btn { width: 30px; height: 30px; border: 0; border-radius: 9px; background: transparent; color: #d1d5db; cursor: pointer; display: grid; place-items: center; font-size: 18px; }
    .tool-btn:hover { background: #292929; }
    .send-btn { width: 34px; height: 34px; border: 0; border-radius: 50%; background: #fff; color: #111; cursor: pointer; display: grid; place-items: center; font-weight: 900; }
    .send-btn:disabled { opacity: .45; cursor: not-allowed; }
    .token-select { border: 0; outline: 0; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; }

    .typing { display: inline-flex; gap: 5px; align-items: center; height: 18px; }
    .typing span { width: 6px; height: 6px; background: #aaa; border-radius: 50%; animation: pulse 1.3s infinite ease-in-out; }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: .35; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }

    @media (max-width: 900px) {
      :root { --side-w: 0px; --side-collapsed: 0px; }
      .sidebar { position: fixed; transform: translateX(-100%); width: 244px; }
      body.mobile-sidebar-open .sidebar { transform: translateX(0); }
      .welcome-inner, body.sidebar-collapsed .welcome-inner, .messages, body.sidebar-collapsed .messages { width: min(820px, calc(100vw - 32px)); }
      .composer, body.sidebar-collapsed .composer { width: min(var(--composer-w), calc(100vw - 36px)); }
      .topbar { padding-left: 12px; padding-right: 12px; }
      .model-picker { width: 240px; max-width: 68vw; }
      .model-name-top { font-size: 15px; }
      .hero-title h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="auth-logo">M</div>
      <h1>MaGary AI</h1>
      <p id="authTip">正在检查访问权限...</p>
      <input id="passwordInput" type="password" placeholder="请输入访问密码" />
      <button onclick="login()">进入</button>
      <div class="auth-error" id="authError"></div>
    </div>
  </div>

  <div class="app">
    <aside class="sidebar">
      <div class="side-top">
        <div class="app-dot">M</div>
        <div class="app-name">MaGary AI</div>
        <button class="collapse-btn" onclick="toggleSidebar()" title="收起 / 展开">
          <span class="collapse-icon-expanded">◧</span>
          <span class="collapse-icon-collapsed">›</span>
        </button>
      </div>

      <div class="nav">
        <button class="nav-btn" onclick="newChat()"><span class="nav-icon">✎</span><span class="nav-label">New Chat</span></button>
        <button class="nav-btn"><span class="nav-icon">⌕</span><span class="nav-label">Search</span></button>
        <button class="nav-btn"><span class="nav-icon">▣</span><span class="nav-label">Workspace</span></button>
      </div>

      <div class="side-section-title">Chats</div>
      <div class="chat-list" id="chatList"></div>

      <div class="profile">
        <div class="avatar">M</div>
        <div class="profile-text">
          <div class="profile-name">Ma Guanghui</div>
          <div class="profile-sub">Private Workspace</div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="model-picker" id="modelPicker">
          <button class="model-trigger" onclick="toggleModelMenu()" type="button">
            <span class="model-trigger-text">
              <span class="model-name-top" id="modelTriggerName">加载模型中...</span>
              <div class="model-provider-top" id="modelTriggerMeta">读取来源...</div>
            </span>
            <span class="chev">⌄</span>
          </button>
          <div class="model-menu" id="modelMenu">
            <div class="model-search"><span>⌕</span><input id="modelSearchInput" type="text" placeholder="搜索模型" /></div>
            <div class="model-list" id="modelMenuList"></div>
          </div>
        </div>
        <div class="top-actions">
          <button class="ghost-btn" onclick="clearCurrentChat()" title="清空当前聊天">⌫</button>
          <button class="ghost-btn" onclick="copyCurrentChat()" title="复制当前聊天">⧉</button>
          <button class="ghost-btn" onclick="logout()" title="退出访问">⏻</button>
        </div>
      </header>

      <section class="main-scroll" id="chatArea">
        <div class="welcome" id="welcome">
          <div class="welcome-inner">
            <div class="hero-title"><div class="hero-logo">M</div><h1 id="heroModelName">MaGary AI</h1></div>
            <div class="composer" id="welcomeComposer">
              <textarea id="welcomeInput" rows="1" placeholder="How can I help you today?"></textarea>
              <div class="composer-bottom">
                <div class="tool-row"><button class="tool-btn" onclick="focusInput()">＋</button><button class="tool-btn">⌘</button></div>
                <button class="send-btn" onclick="sendWelcomeMessage()">↑</button>
              </div>
            </div>
            <div class="suggestions">
              <div class="suggestions-title">✦ Suggested</div>
              <div class="suggestion" onclick="usePrompt('请展示一个 Python FastAPI 的代码片段')"><strong>Show me a code snippet</strong><span>of a FastAPI endpoint</span></div>
              <div class="suggestion" onclick="usePrompt('帮我整理一下这个 API 项目的架构逻辑')"><strong>Help me study</strong><span>this API project architecture</span></div>
              <div class="suggestion" onclick="usePrompt('请帮我优化这个 MaGary AI 项目的 UI 和代码结构')"><strong>Improve my project</strong><span>UI and backend structure</span></div>
            </div>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <div class="composer-wrap" id="bottomComposerWrap" style="display:none;">
        <div class="composer">
          <textarea id="input" rows="1" placeholder="Message MaGary AI"></textarea>
          <div class="composer-bottom">
            <div class="tool-row"><button class="tool-btn">＋</button><button class="tool-btn">⌘</button></div>
            <div class="tool-row">
              <select id="maxTokens" class="token-select">
                <option value="512">512 tokens</option>
                <option value="1024" selected>1024 tokens</option>
                <option value="2048">2048 tokens</option>
              </select>
              <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "magary_owui_sessions_v1";
    const MODEL_KEY = "magary_owui_model_v1";
    const PASSWORD_KEY = "magary_ai_access_password";
    const SIDEBAR_KEY = "magary_owui_sidebar_collapsed";

    const authScreen = document.getElementById("authScreen");
    const authTip = document.getElementById("authTip");
    const passwordInput = document.getElementById("passwordInput");
    const authError = document.getElementById("authError");
    const chatListEl = document.getElementById("chatList");
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const welcomeInput = document.getElementById("welcomeInput");
    const sendBtn = document.getElementById("sendBtn");
    const chatArea = document.getElementById("chatArea");
    const welcome = document.getElementById("welcome");
    const bottomComposerWrap = document.getElementById("bottomComposerWrap");
    const maxTokens = document.getElementById("maxTokens");
    const modelPicker = document.getElementById("modelPicker");
    const modelTriggerName = document.getElementById("modelTriggerName");
    const modelTriggerMeta = document.getElementById("modelTriggerMeta");
    const heroModelName = document.getElementById("heroModelName");
    const modelMenuList = document.getElementById("modelMenuList");
    const modelSearchInput = document.getElementById("modelSearchInput");

    let sessions = [];
    let currentId = null;
    let models = [];
    let selectedModelId = "openrouter/free";

    const fallbackModels = [
      { id: "openrouter/free", name: "OpenRouter Free", provider: "OpenRouter" },
      { id: "cerebras/gpt-oss-120b", name: "Cerebras GPT OSS 120B", provider: "Cerebras" },
      { id: "nvidia/meta/llama-3.1-405b-instruct", name: "NVIDIA Llama 3.1 405B", provider: "NVIDIA" }
    ];

    function normProvider(model){
      const raw = (model.provider || model.channel || "OpenRouter").toString();
      const id = (model.id || "").toLowerCase();
      const r = raw.toLowerCase();
      if (r.includes("nvidia") || id.startsWith("nvidia/")) return "NVIDIA";
      if (r.includes("cerebras") || id.startsWith("cerebras/")) return "Cerebras";
      return "OpenRouter";
    }
    function providerClass(model){ return normProvider(model).toLowerCase(); }
    function shortName(model){ return (model.name || model.id || "Model"); }
    function modelInitial(model){
      const p = normProvider(model);
      if (p === "NVIDIA") return "NV";
      if (p === "Cerebras") return "CB";
      return "OR";
    }
    function getPassword(){ return sessionStorage.getItem(PASSWORD_KEY) || ""; }
    function setPassword(pwd){ sessionStorage.setItem(PASSWORD_KEY, pwd); }
    function clearPassword(){ sessionStorage.removeItem(PASSWORD_KEY); }

    async function initAuth(){
      authScreen.style.display = "flex";
      passwordInput.style.display = "none";
      try {
        const res = await fetch("/auth/status");
        const data = await res.json();
        if (!data.password_required) { authScreen.style.display = "none"; return; }
        const saved = getPassword();
        if (saved && await verifyPassword(saved, false)) { authScreen.style.display = "none"; return; }
        clearPassword();
        showLoginBox();
      } catch(e) { authTip.textContent = "权限检查失败，请刷新页面"; authError.textContent = e.message; }
    }
    function showLoginBox(){ authTip.textContent = "请输入访问密码"; passwordInput.style.display = "block"; passwordInput.value = ""; authError.textContent = ""; setTimeout(()=>passwordInput.focus(),100); }
    async function verifyPassword(pwd, showError=true){
      try{
        const res = await fetch("/auth", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({password: pwd}) });
        if (res.ok) return true;
        if (showError) authError.textContent = "密码错误";
        return false;
      }catch(e){ if(showError) authError.textContent = "验证失败：" + e.message; return false; }
    }
    async function login(){
      const pwd = passwordInput.value.trim();
      if(!pwd){ authError.textContent = "请输入密码"; return; }
      if(await verifyPassword(pwd,true)){ setPassword(pwd); authScreen.style.display = "none"; focusInput(); }
    }
    function logout(){ clearPassword(); showLoginBox(); authScreen.style.display = "flex"; }
    passwordInput.addEventListener("keydown", e => { if(e.key === "Enter") login(); });

    function uid(){ return "chat_" + Date.now() + "_" + Math.random().toString(16).slice(2); }
    function loadSidebarState(){ if(localStorage.getItem(SIDEBAR_KEY) === "true") document.body.classList.add("sidebar-collapsed"); }
    function toggleSidebar(){ document.body.classList.toggle("sidebar-collapsed"); localStorage.setItem(SIDEBAR_KEY, document.body.classList.contains("sidebar-collapsed") ? "true" : "false"); }

    function loadSessions(){
      try{ sessions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { sessions = []; }
      if(!sessions.length) sessions.push({id:uid(), title:"New Chat", messages:[]});
      currentId = sessions[0].id;
      saveSessions(); renderAll();
    }
    function saveSessions(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); }
    function getCurrentSession(){ return sessions.find(s => s.id === currentId); }
    function newChat(){ sessions.unshift({id:uid(), title:"New Chat", messages:[]}); currentId = sessions[0].id; saveSessions(); renderAll(); focusInput(); }
    function deleteSession(id){
      sessions = sessions.filter(s => s.id !== id);
      if(!sessions.length) sessions.push({id:uid(), title:"New Chat", messages:[]});
      if(currentId === id) currentId = sessions[0].id;
      saveSessions(); renderAll();
    }
    function clearCurrentChat(){ const s=getCurrentSession(); s.messages=[]; s.title="New Chat"; saveSessions(); renderAll(); }
    async function copyCurrentChat(){
      const s=getCurrentSession(); if(!s.messages.length) return;
      await navigator.clipboard.writeText(s.messages.map(m => `${m.role === "user" ? "用户" : "AI"}：${m.content}`).join("\n\n"));
      alert("当前会话已复制");
    }

    function renderChatList(){
      chatListEl.innerHTML = "";
      sessions.forEach(s => {
        const item = document.createElement("button");
        item.className = "chat-item" + (s.id === currentId ? " active" : "");
        item.innerHTML = `<span class="chat-glyph">▥</span><span class="chat-title"></span><button class="chat-del" title="删除">×</button>`;
        item.querySelector(".chat-title").textContent = s.title || "New Chat";
        item.onclick = () => { currentId=s.id; renderAll(); };
        item.querySelector(".chat-del").onclick = e => { e.stopPropagation(); deleteSession(s.id); };
        chatListEl.appendChild(item);
      });
    }
    function renderMessages(){
      const s=getCurrentSession(); messagesEl.innerHTML="";
      const empty = !s.messages.length;
      welcome.style.display = empty ? "flex" : "none";
      bottomComposerWrap.style.display = empty ? "none" : "block";
      s.messages.forEach(m => addMessageToDOM(m.content, m.role, false));
      scrollBottom();
    }
    function renderAll(){ renderChatList(); renderMessages(); }
    function setTitleFromMessage(text){ const s=getCurrentSession(); if(s.title === "New Chat") s.title = text.slice(0,28) + (text.length>28 ? "..." : ""); }
    function scrollBottom(){ chatArea.scrollTop = chatArea.scrollHeight; }

    function escapeHtml(text){ const div=document.createElement("div"); div.textContent=text; return div.innerHTML; }
    function simpleMarkdown(text){
      let html = escapeHtml(text);
      html = html.replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      html = html.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\n/g, "<br>");
      return html;
    }
    function addMessageToDOM(content, role, save=true){
      const msg=document.createElement("div"); msg.className="msg " + role;
      if(role === "assistant"){ const av=document.createElement("div"); av.className="msg-avatar"; av.textContent="AI"; msg.appendChild(av); }
      const wrap=document.createElement("div"); wrap.className="bubble-wrap";
      const bubble=document.createElement("div"); bubble.className="bubble"; bubble.innerHTML=simpleMarkdown(content);
      wrap.appendChild(bubble);
      if(role === "assistant"){
        const copy=document.createElement("button"); copy.className="copy-btn"; copy.textContent="复制";
        copy.onclick = async()=>{ await navigator.clipboard.writeText(content); copy.textContent="已复制"; setTimeout(()=>copy.textContent="复制",1000); };
        wrap.appendChild(copy);
      }
      msg.appendChild(wrap); messagesEl.appendChild(msg);
      if(save){ const s=getCurrentSession(); s.messages.push({role, content}); saveSessions(); renderChatList(); }
      scrollBottom(); return bubble;
    }
    function addTypingBubble(){ return addMessageToDOM("<typing>", "assistant", false); }
    function setTypingBubble(bubble){ bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>'; }

    async function loadModels(){
      try{ const res=await fetch("/models"); const data=await res.json(); models = data.models && data.models.length ? data.models : fallbackModels; }
      catch{ models = fallbackModels; }
      const saved=localStorage.getItem(MODEL_KEY); selectedModelId = saved || models[0]?.id || "openrouter/free";
      if(!models.some(m => m.id === selectedModelId)) selectedModelId = models[0]?.id || "openrouter/free";
      renderModelMenu(); updateSelectedModelUI();
    }
    function toggleModelMenu(){ modelPicker.classList.toggle("open"); if(modelPicker.classList.contains("open")){ modelSearchInput.value=""; renderModelMenu(); setTimeout(()=>modelSearchInput.focus(),80); } }
    function closeModelMenu(){ modelPicker.classList.remove("open"); }
    function renderModelMenu(){
      const keyword=modelSearchInput.value.trim().toLowerCase();
      const filtered=models.filter(m => shortName(m).toLowerCase().includes(keyword) || (m.id||"").toLowerCase().includes(keyword) || normProvider(m).toLowerCase().includes(keyword));
      modelMenuList.innerHTML="";
      if(!filtered.length){ const empty=document.createElement("div"); empty.className="model-empty"; empty.textContent="没有找到匹配模型"; modelMenuList.appendChild(empty); return; }
      filtered.forEach(m => {
        const btn=document.createElement("button"); btn.className="model-option" + (m.id === selectedModelId ? " active" : ""); btn.type="button";
        const p=normProvider(m);
        btn.innerHTML = `<span class="model-mark">${modelInitial(m)}</span><span class="model-info"><span class="model-title"></span><span class="model-meta">${p}</span></span><span class="provider-pill ${providerClass(m)}">${p}</span>`;
        btn.querySelector(".model-title").textContent = shortName(m);
        btn.onclick=()=>{ selectedModelId=m.id; localStorage.setItem(MODEL_KEY, selectedModelId); updateSelectedModelUI(); closeModelMenu(); };
        modelMenuList.appendChild(btn);
      });
    }
    function updateSelectedModelUI(){
      const m=models.find(x=>x.id===selectedModelId) || models[0];
      if(!m){ modelTriggerName.textContent="未选择模型"; modelTriggerMeta.textContent=""; return; }
      modelTriggerName.textContent = shortName(m);
      modelTriggerMeta.textContent = normProvider(m);
      heroModelName.textContent = shortName(m);
    }
    modelSearchInput.addEventListener("input", renderModelMenu);
    document.addEventListener("click", e => { if(!modelPicker.contains(e.target)) closeModelMenu(); });
    document.addEventListener("keydown", e => { if(e.key === "Escape") closeModelMenu(); });

    function focusInput(){ (welcome.style.display !== "none" ? welcomeInput : inputEl).focus(); }
    function usePrompt(text){
      if(welcome.style.display !== "none") welcomeInput.value = text; else inputEl.value = text;
      autoResizeAll(); focusInput();
    }
    function sendWelcomeMessage(){ const text=welcomeInput.value.trim(); if(!text) return; welcomeInput.value=""; sendText(text); }
    function sendMessage(){ const text=inputEl.value.trim(); if(!text) return; inputEl.value=""; sendText(text); }
    async function sendText(text){
      const s=getCurrentSession();
      setTitleFromMessage(text);
      welcome.style.display="none"; bottomComposerWrap.style.display="block";
      addMessageToDOM(text,"user");
      autoResizeAll(); sendBtn.disabled=true;
      const typing = addTypingBubble(); setTypingBubble(typing);
      const history=s.messages.filter(m => m.role === "user" || m.role === "assistant").slice(-10);
      try{
        const response=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,model:selectedModelId,history,max_tokens:Number(maxTokens.value||1024),password:getPassword()})});
        const data=await response.json();
        if(response.status===401){ clearPassword(); showLoginBox(); authScreen.style.display="flex"; typing.textContent="访问密码错误，请重新登录"; return; }
        if(data.reply){ typing.innerHTML=simpleMarkdown(data.reply); s.messages.push({role:"assistant",content:data.reply}); saveSessions(); renderAll(); }
        else { typing.textContent="请求失败：" + (data.error || JSON.stringify(data)); }
      }catch(err){ typing.textContent="请求失败：" + err.message; }
      sendBtn.disabled=false; focusInput(); scrollBottom();
    }
    function autoResize(el){ el.style.height="auto"; el.style.height=Math.min(el.scrollHeight,160)+"px"; }
    function autoResizeAll(){ autoResize(inputEl); autoResize(welcomeInput); }
    inputEl.addEventListener("input",()=>autoResize(inputEl));
    welcomeInput.addEventListener("input",()=>autoResize(welcomeInput));
    inputEl.addEventListener("keydown", e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendMessage(); } });
    welcomeInput.addEventListener("keydown", e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendWelcomeMessage(); } });

    loadSidebarState();
    loadSessions();
    loadModels();
    initAuth();
    autoResizeAll();
  </script>
</body>
</html>
